<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Clash - Отбор</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .home-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #1B2028;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 64px; padding: 4px 0; border-radius: 12px; background: transparent; border: none; cursor: pointer;
      color: rgba(255, 255, 255, 0.5); transition: all 0.2s ease;
    }
    .nav-btn:hover { color: #ffffff; }
    .nav-btn.active { color: #00e6c3; background-color: rgba(0, 137, 123, 0.15); }
    .nav-btn svg { width: 20px; height: 20px; margin-bottom: 4px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn span { font-size: 10px; font-weight: 600; font-family: sans-serif; }
  </style>
</head>
<body class="bg-[#111418] text-white min-h-screen pb-24">

  <!-- ГОРЕН СТАТУС БАР (Хедър) -->
  <div class="max-w-md mx-auto p-4 space-y-2">
    <div class="relative w-full bg-[#1c2128] border border-white/10 rounded-full p-1 flex items-center shadow-inner">
      <div class="absolute -left-1 flex items-center gap-1 bg-[#1c2128] border border-amber-500/50 px-2.5 py-1 rounded-full text-amber-400 font-bold text-xs shadow-md z-10">
        <span>★</span>
        <span id="player-level">1</span>
      </div>
      <div class="w-full bg-[#252b36] rounded-full h-5 relative overflow-hidden flex items-center justify-center">
        <div id="xp-fill" class="absolute left-0 top-0 bottom-0 bg-amber-400 rounded-full transition-all" style="width: 35%;"></div>
        <span id="xp-text" class="relative z-10 text-[11px] font-bold text-black">35 / 100</span>
      </div>
    </div>

    <div class="flex items-center gap-2 overflow-x-auto">
      <div class="flex items-center gap-2 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5 flex-1 min-w-[110px]">
        <span class="text-amber-400 text-sm">⚡</span>
        <div class="flex-1 bg-black/50 rounded-full h-2 overflow-hidden">
          <div id="energy-fill" class="bg-amber-400 h-full rounded-full" style="width: 100%;"></div>
        </div>
        <span id="player-energy" class="text-xs font-bold text-white">100</span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-amber-600 text-sm">🪙</span>
        <span id="player-coins" class="text-xs font-bold text-white">1,250</span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-[#40c4ff] text-sm">💎</span>
        <span id="player-gems" class="text-xs font-bold text-white">45</span>
      </div>
      <button onclick="location.href='shop.html'" class="flex items-center gap-1.5 bg-[#7c3aed] hover:bg-[#6d28d9] transition-all text-white font-bold px-3.5 py-1.5 rounded-full text-xs shadow-md cursor-pointer flex-shrink-0">
        <span>🛒</span>
        <span>Магазин</span>
      </button>
    </div>
  </div>

  <!-- ОСНОВЕН КОНТЕЙНЕР НА ОТБОРА -->
  <div class="max-w-2xl mx-auto px-4 py-2 space-y-5">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Отбор</h1>
        <p class="text-gray-400 text-sm" id="team-name-display">Моят Клуб</p>
      </div>
      <div class="flex items-center gap-2">
        <select id="formation-select" onchange="changeFormation(this.value)" class="bg-[#1c2128] border border-white/10 text-white text-xs rounded-xl px-3 py-2 outline-none">
          <option value="4-4-2">4-4-2</option>
          <option value="4-3-3">4-3-3</option>
          <option value="3-5-2">3-5-2</option>
          <option value="4-2-3-1">4-2-3-1</option>
          <option value="5-3-2">5-3-2</option>
        </select>
        <div class="flex rounded-xl overflow-hidden border border-white/10">
          <button onclick="switchView('pitch')" id="btn-view-pitch" class="px-3 py-2 text-xs font-semibold bg-emerald-600 text-white">⚽</button>
          <button onclick="switchView('list')" id="btn-view-list" class="px-3 py-2 text-xs font-semibold bg-[#1c2128] text-gray-400">📋</button>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span class="font-bold text-sm">Състав: <span id="squad-count">0</span>/11</span>
      <div class="flex-1 h-1.5 bg-black/40 rounded-full overflow-hidden">
        <div id="squad-progress" class="h-full bg-emerald-500 rounded-full transition-all" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Игрище / Списък контейнер -->
    <div id="team-view-container"></div>

    <!-- Резерви секция -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-sm" id="bench-title">Резерви (0)</h2>
      </div>
      <div id="bench-players-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </div>
  </div>

  <!-- ДОЛНА НАВИГАЦИОННА ЛЕНТА -->
  <nav class="home-bar">
    <button onclick="location.href='matches.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6m12 5h1.5a2.5 2.5 0 000-5H18M6 4h12v6a6 6 0 01-12 0V4zm6 11v4m-3 0h6"></path></svg>
      <span>Мачове</span>
    </button>
    <button onclick="location.href='training.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h-3a1 1 0 00-1 1v10a1 1 0 001 1h3M17.5 6h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6.5 12h11M2 10h2v4H2zm18 0h2v4h-2z"></path></svg>
      <span>Трен.</span>
    </button>
    <button onclick="location.href='index.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Начало</span>
    </button>
    <button onclick="location.href='team.html'" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span>Отбор</span>
    </button>
    <button onclick="location.href='profile.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Профил</span>
    </button>
  </nav>

  <!-- СКРИПТ ЗА ЛОГИКАТА НА ОТБОРА -->
  <script>
    const FORMATION_POSITIONS = {
      "4-4-2":   [[50,88],[15,65],[35,65],[65,65],[85,65],[15,42],[35,42],[65,42],[85,42],[30,18],[70,18]],
      "4-3-3":   [[50,88],[15,65],[35,65],[65,65],[85,65],[25,45],[50,42],[75,45],[25,18],[50,15],[75,18]],
      "4-2-3-1": [[50,88],[15,65],[35,65],[65,65],[85,65],[35,52],[65,52],[20,35],[50,32],[80,35],[50,15]],
      "3-5-2":   [[50,88],[25,68],[50,65],[75,68],[15,45],[35,42],[55,40],[75,42],[90,45],[35,18],[65,18]],
      "5-3-2":   [[50,88],[10,65],[28,68],[50,70],[72,68],[90,65],[25,45],[50,42],[75,45],[35,18],[65,18]],
    };

    let currentFormation = "4-4-2";
    let currentView = "pitch";
    let mockPlayers = [
      { id: 1, name: "Иван Георгиев", overall_rating: 82, rarity: "epic", position: "GK", in_squad: true },
      { id: 2, name: "Петър Петров", overall_rating: 78, rarity: "rare", position: "CB", in_squad: true },
      { id: 3, name: "Димитър Колев", overall_rating: 76, rarity: "common", position: "CB", in_squad: true },
      { id: 4, name: "Георги Николов", overall_rating: 79, rarity: "rare", position: "LB", in_squad: true },
      { id: 5, name: "Христо Стоянов", overall_rating: 75, rarity: "common", position: "RB", in_squad: true },
      { id: 6, name: "Мартин Илиев", overall_rating: 80, rarity: "epic", position: "CM", in_squad: true },
      { id: 7, name: "Николай Василев", overall_rating: 77, rarity: "common", position: "CM", in_squad: true },
      { id: 8, name: "Тодор Маринов", overall_rating: 81, rarity: "rare", position: "LM", in_squad: true },
      { id: 9, name: "Стефан Христов", overall_rating: 74, rarity: "common", position: "RM", in_squad: true },
      { id: 10, name: "Борис Димов", overall_rating: 85, rarity: "legendary", position: "ST", in_squad: true },
      { id: 11, name: "Александър Павлов", overall_rating: 83, rarity: "epic", position: "ST", in_squad: true },
      { id: 12, name: "Владимир Тодоров", overall_rating: 72, rarity: "common", position: "GK", in_squad: false },
      { id: 13, name: "Калоян Здравков", overall_rating: 75, rarity: "rare", position: "ST", in_squad: false }
    ];

    const rarityBorders = { common: "border-zinc-400", rare: "border-blue-400", epic: "border-purple-400", legendary: "border-amber-400" };

    function changeFormation(val) {
      currentFormation = val;
      renderTeamView();
    }

    function switchView(viewType) {
      currentView = viewType;
      document.getElementById("btn-view-pitch").className = viewType === "pitch" ? "px-3 py-2 text-xs font-semibold bg-emerald-600 text-white" : "px-3 py-2 text-xs font-semibold bg-[#1c2128] text-gray-400";
      document.getElementById("btn-view-list").className = viewType === "list" ? "px-3 py-2 text-xs font-semibold bg-emerald-600 text-white" : "px-3 py-2 text-xs font-semibold bg-[#1c2128] text-gray-400";
      renderTeamView();
    }

    function togglePlayerSquad(id) {
      const player = mockPlayers.find(p => p.id === id);
      if (!player) return;
      const squadCount = mockPlayers.filter(p => p.in_squad).length;
      if (!player.in_squad && squadCount >= 11) {
        alert("Съставът е пълен (11/11)!");
        return;
      }
      player.in_squad = !player.in_squad;
      renderTeamView();
    }

    function renderTeamView() {
      const squadPlayers = mockPlayers.filter(p => p.in_squad);
      const benchPlayers = mockPlayers.filter(p => !p.in_squad);

      document.getElementById("squad-count").innerText = squadPlayers.length;
      document.getElementById("squad-progress").style.width = `${(squadPlayers.length / 11) * 100}%`;
      document.getElementById("bench-title").innerText = `Резерви (${benchPlayers.length})`;

      const container = document.getElementById("team-view-container");

      if (currentView === "pitch") {
        const positions = FORMATION_POSITIONS[currentFormation] || FORMATION_POSITIONS["4-4-2"];
        let slotsHtml = `
          <svg class="absolute inset-0 w-full h-full opacity-20" viewBox="0 0 100 140" preserveAspectRatio="none">
            <rect x="1" y="1" width="98" height="138" fill="none" stroke="white" stroke-width="0.8" />
            <line x1="1" y1="70" x2="99" y2="70" stroke="white" stroke-width="0.6" />
            <circle cx="50" cy="70" r="12" fill="none" stroke="white" stroke-width="0.6" />
            <circle cx="50" cy="70" r="1" fill="white" />
            <rect x="25" y="1" width="50" height="18" fill="none" stroke="white" stroke-width="0.6" />
            <rect x="25" y="121" width="50" height="18" fill="none" stroke="white" stroke-width="0.6" />
            <rect x="35" y="1" width="30" height="8" fill="none" stroke="white" stroke-width="0.6" />
            <rect x="35" y="131" width="30" height="8" fill="none" stroke="white" stroke-width="0.6" />
            <circle cx="50" cy="15" r="3" fill="none" stroke="white" stroke-width="0.5" />
            <circle cx="50" cy="125" r="3" fill="none" stroke="white" stroke-width="0.5" />
          </svg>
        `;

        positions.forEach((pos, i) => {
          const player = squadPlayers[i];
          if (player) {
            const borderClass = rarityBorders[player.rarity] || "border-zinc-400";
            slotsHtml += `
              <button onclick="togglePlayerSquad(${player.id})" class="absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer" style="left: ${pos[0]}%; top: ${pos[1]}%;">
                <div class="flex flex-col items-center gap-0.5">
                  <div class="w-9 h-9 rounded-full bg-gradient-to-b from-[#1c2128] to-[#111418] border-2 ${borderClass} flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold text-xs">${player.overall_rating}</span>
                  </div>
                  <div class="bg-black/70 rounded px-1 py-0.5 max-w-16">
                    <p class="text-white text-[8px] font-semibold truncate">${player.name.split(" ")[0]}</p>
                  </div>
                </div>
              </button>
            `;
          } else {
            slotsHtml += `
              <div class="absolute transform -translate-x-1/2 -translate-y-1/2" style="left: ${pos[0]}%; top: ${pos[1]}%;">
                <div class="flex flex-col items-center gap-0.5">
                  <div class="w-9 h-9 rounded-full border-2 border-dashed border-white/20 flex items-center justify-center">
                    <span class="text-white/20 text-xs">+</span>
                  </div>
                  <div class="bg-black/40 rounded px-1 py-0.5">
                    <p class="text-white/30 text-[8px]">Пусто</p>
                  </div>
                </div>
              </div>
            `;
          }
        });

        container.innerHTML = `
          <div class="relative w-full rounded-2xl overflow-hidden shadow-xl" style="padding-bottom: 140%;">
            <div class="absolute inset-0 bg-gradient-to-b from-green-800 to-green-900">
              ${slotsHtml}
            </div>
          </div>
        `;
      } else {
        let listHtml = squadPlayers.length === 0 ? '<p class="text-gray-400 text-sm col-span-2 text-center py-4">Няма играчи в състава.</p>' : '';
        squadPlayers.forEach(p => {
          listHtml += `
            <div onclick="togglePlayerSquad(${p.id})" class="bg-[#1c2128] border border-white/10 rounded-xl p-3 flex items-center justify-between cursor-pointer hover:border-emerald-500 transition-all">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full border-2 ${rarityBorders[p.rarity]} flex items-center justify-center font-bold text-xs">${p.overall_rating}</div>
                <div>
                  <p class="text-xs font-bold">${p.name}</p>
                  <p class="text-[10px] text-gray-400">${p.position}</p>
                </div>
              </div>
              <span class="text-xs text-red-400 font-bold">✕ Премахни</span>
            </div>
          `;
        });
        container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${listHtml}</div>`;
      }

      const benchContainer = document.getElementById("bench-players-grid");
      let benchHtml = "";
      if (benchPlayers.length === 0) {
        benchContainer.innerHTML = `<div class="col-span-full bg-[#1c2128] border border-dashed border-white/10 rounded-2xl p-4 text-center text-gray-400 text-sm">Няма резервни играчи.</div>`;
      } else {
        benchPlayers.sort((a,b) => b.overall_rating - a.overall_rating).forEach(p => {
          const borderClass = rarityBorders[p.rarity] || "border-zinc-400";
          benchHtml += `
            <div onclick="togglePlayerSquad(${p.id})" class="bg-[#1c2128] border border-white/10 rounded-xl p-3 flex flex-col gap-2 cursor-pointer hover:border-emerald-500 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold truncate">${p.name}</span>
                <span class="text-[10px] bg-white/5 px-2 py-0.5 rounded">${p.position}</span>
              </div>
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full border-2 ${borderClass} flex items-center justify-center font-bold text-xs">${p.overall_rating}</div>
                <span class="text-[11px] text-emerald-400 font-semibold">+ Добави</span>
              </div>
            </div>
          `;
        });
        benchContainer.innerHTML = benchHtml;
      }
    }

    renderTeamView();
  </script>
</body>
</html>
