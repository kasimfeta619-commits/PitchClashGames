<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отбор и Гласуване - Тактическа арена</title>
  <style>
    :root {
      --background: #121212;
      --card: #1c2128;
      --card-foreground: #ffffff;
      --primary: #00e6c3;
      --primary-foreground: #121212;
      --muted: rgba(255, 255, 255, 0.1);
      --muted-foreground: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --destructive: #ef4444;
      --bot-color: #64748b;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--background);
      color: var(--card-foreground);
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 672px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 96px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 { font-size: 22px; font-weight: bold; margin: 0 0 2px 0; }
    .header p { color: var(--muted-foreground); font-size: 12px; margin: 0; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .select-box, .btn-custom {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--card-foreground);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .btn-custom {
      background-color: rgba(0, 230, 195, 0.15);
      color: var(--primary);
      border-color: rgba(0, 230, 195, 0.3);
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-custom:hover { background-color: rgba(0, 230, 195, 0.25); }

    .view-toggle {
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .view-btn {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .view-btn.active { background-color: var(--primary); color: var(--primary-foreground); }
    .view-btn.inactive { background-color: var(--card); color: var(--muted-foreground); }

    /* Season & Captain Banner */
    .season-banner {
      background: linear-gradient(135deg, #1c2128, #182830);
      border: 1px solid rgba(0, 230, 195, 0.3);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .season-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .captain-badge {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .squad-count-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 14px;
    }

    .counter-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: var(--muted);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    /* Pitch View */
    .pitch-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      padding-bottom: 140%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .pitch-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #166534, #14532d);
    }

    .pitch-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .player-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: transform 0.2s;
    }
    .player-bubble:hover { transform: scale(1.08); }

    .player-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(to bottom, var(--card), #0f1318);
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .player-avatar span { color: #ffffff; font-weight: bold; font-size: 11px; }

    .player-label {
      background-color: rgba(0,0,0,0.8);
      border-radius: 4px;
      padding: 2px 4px;
      max-width: 75px;
      text-align: center;
    }
    .player-label p {
      color: #ffffff;
      font-size: 8px;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bot-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px dashed var(--bot-color);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(100, 116, 139, 0.2);
    }
    .bot-avatar span { color: var(--bot-color); font-size: 10px; font-weight: bold; }
    .bot-label { background-color: rgba(51, 65, 85, 0.7); border-radius: 4px; padding: 2px 4px; }
    .bot-label p { color: #94a3b8; font-size: 7px; margin: 0; }

    /* Bench Section */
    .bench-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bench-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bench-header h2 { font-weight: bold; font-size: 15px; margin: 0; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 4px;
    }
    @media (min-width: 640px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .empty-box {
      background-color: var(--card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .empty-box p { color: var(--muted-foreground); font-size: 13px; margin: 0; }

    .mock-player-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .mock-player-card:active { cursor: grabbing; }
    .mock-player-card:hover { border-color: var(--primary); transform: translateY(-2px); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-content {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { font-size: 16px; font-weight: bold; margin: 0; }

    .btn-action {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
    .btn-action.default { background-color: var(--primary); color: var(--primary-foreground); }
    .btn-action.destructive { background-color: var(--destructive); color: #ffffff; }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    /* HomeBar стилове */
    .home-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1B2028;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 64px;
      padding: 4px 0;
      border-radius: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      color: #ffffff;
    }
    .nav-btn.active {
      color: #00e6c3;
      background-color: rgba(0, 137, 123, 0.15);
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-btn span {
      font-size: 10px;
      font-weight: 600;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <!-- ГОРЕН XP / НИВО БАР -->
    <div style="position:relative; width:100%; background:#1c2128; border:1px solid rgba(255,255,255,0.1); border-radius:9999px; padding:4px; display:flex; align-items:center; box-shadow:inset 0 2px 4px rgba(0,0,0,0.4);">
      <div style="position:absolute; left:-4px; display:flex; align-items:center; gap:4px; background:#1c2128; border:1px solid rgba(245,158,11,0.5); padding:2px 10px; border-radius:9999px; color:#f59e0b; font-weight:bold; font-size:12px; box-shadow:0 4px 6px rgba(0,0,0,0.3); z-index:10;">
        <span>★</span>
        <span id="player-level">0</span>
      </div>
      <div style="width:100%; background:#252b36; border-radius:9999px; height:20px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;">
        <div id="xp-fill" style="position:absolute; left:0; top:0; bottom:0; background:#f59e0b; border-radius:9999px; transition:all 0.3s; width:0%;"></div>
        <span id="xp-text" style="position:relative; z-index:10; font-size:11px; font-weight:bold; color:#000;">0 / 100</span>
      </div>
    </div>

    <!-- ДОЛЕН РЕД (Енергия, Монети, Диаманти, Магазин) -->
    <div style="display:flex; align-items:center; gap:8px; overflow-x:auto;">
      <div style="display:flex; align-items:center; gap:8px; background:#1c2128; border:1px solid rgba(255,255,255,0.1); border-radius:9999px; padding:6px 12px; flex:1; min-width:110px;">
        <span style="color:#f59e0b; font-size:14px;">⚡</span>
        <div style="flex:1; background:rgba(0,0,0,0.5); border-radius:9999px; height:8px; overflow:hidden;">
          <div id="energy-fill" style="background:#f59e0b; height:100%; border-radius:9999px; width:100%;"></div>
        </div>
        <span id="player-energy" style="font-size:12px; font-weight:bold; color:#fff;">100</span>
      </div>

      <div style="display:flex; align-items:center; gap:6px; background:#1c2128; border:1px solid rgba(255,255,255,0.1); border-radius:9999px; padding:6px 12px;">
        <span style="color:#d97706; font-size:14px;">🪙</span>
        <span id="player-coins" style="font-size:12px; font-weight:bold; color:#fff;">0</span>
      </div>

      <div style="display:flex; align-items:center; gap:6px; background:#1c2128; border:1px solid rgba(255,255,255,0.1); border-radius:9999px; padding:6px 12px;">
        <span style="color:#40c4ff; font-size:14px;">💎</span>
        <span id="player-gems" style="font-size:12px; font-weight:bold; color:#fff;">0</span>
      </div>

      <button onclick="openShop()" style="background:#7c3aed; color:white; border:none; padding:6px 14px; border-radius:9999px; font-weight:bold; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <span>🛒</span>
        <span>Магазин</span>
      </button>
    </div>

    <!-- Header -->
    <div class="header">
      <div>
        <h1 id="team-name">Моят Клуб</h1>
        <p>Управление на отбор и състав</p>
      </div>
      <div class="header-actions">
        <button class="btn-custom" onclick="autoFillLineup()">⚡ Интелигентно авто-попълване</button>
        <select class="select-box" id="formation-select">
          <option value="4-4-2">4-4-2</option>
          <option value="4-3-3">4-3-3</option>
          <option value="3-5-2">3-5-2</option>
          <option value="4-2-3-1">4-2-3-1</option>
          <option value="5-3-2">5-3-2</option>
        </select>
        <div class="view-toggle">
          <button class="view-btn active" onclick="setView('pitch')">⚽</button>
          <button class="view-btn inactive" onclick="setView('list')">📋</button>
        </div>
      </div>
    </div>

    <!-- Season & Captain Banner -->
    <div class="season-banner">
      <div class="season-info-row">
        <span id="season-title" style="font-weight: bold; color: var(--primary);">🏆 Сезон 1 (Календар)</span>
        <div class="captain-badge" id="captain-status-badge">
          <span>👑</span> <span id="captain-name-text">Капитан: Иван Петров</span>
        </div>
      </div>
      <div style="font-size: 11px; color: var(--muted-foreground); display: flex; justify-content: space-between; align-items: center;">
        <span>Съставът се пази автоматично според вота на капитана</span>
        <button onclick="toggleMyCaptaincy()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:bold; font-size:11px;" id="toggle-captain-btn">[ Превключи роля ]</button>
      </div>
    </div>

    <!-- Counters -->
    <div class="squad-count-container">
      <div class="counter-row">
        <span style="color: var(--primary);">👥 Клубни членове: <span id="total-members-count">0</span> / 50</span>
        <span style="color: #94a3b8;">Стартова единадесеторка: <span id="pitch-active-count">0</span>/11</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Main View -->
    <div id="main-view-container"></div>

    <!-- Bench Section -->
    <div class="bench-section" id="bench-section-box">
      <div class="bench-header">
        <h2 id="bench-heading">Резерви / Клубни членове (0)</h2>
      </div>
      <div id="bench-container" class="cards-grid"></div>
    </div>
  </div>

  <!-- Долна навигационна лента (HomeBar) -->
  <nav class="home-bar">
    <button onclick="changeTab('matches')" data-tab="matches" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6m12 5h1.5a2.5 2.5 0 000-5H18M6 4h12v6a6 6 0 01-12 0V4zm6 11v4m-3 0h6"></path></svg>
      <span>Мачове</span>
    </button>

    <button onclick="changeTab('training')" data-tab="training" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h-3a1 1 0 00-1 1v10a1 1 0 001 1h3M17.5 6h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6.5 12h11M2 10h2v4H2zm18 0h2v4h-2z"></path></svg>
      <span>Трен.</span>
    </button>

    <button onclick="changeTab('home')" data-tab="home" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Начало</span>
    </button>

    <button onclick="changeTab('team')" data-tab="team" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span>Отбор</span>
    </button>

    <button onclick="changeTab('profile')" data-tab="profile" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Профил</span>
    </button>
  </nav>

  <!-- Modal -->
  <div class="modal-backdrop" id="player-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-player-name">Име на член</h3>
        <button onclick="closeModal()" style="background:none; border:none; color:var(--muted-foreground); cursor:pointer; font-size:16px;">✕</button>
      </div>
      <div id="modal-card-container"></div>
      <button class="btn-action" id="modal-action-btn" onclick="handleModalAction()">Действие</button>
    </div>
  </div>

  <script>
    function changeTab(tabId) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.getAttribute('data-tab') === tabId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function openShop() {
      alert("Магазинът е отворен!");
    }

    const FORMATION_POSITIONS = {
      "4-4-2":   [[50,88],[15,65],[35,65],[65,65],[85,65],[15,42],[35,42],[65,42],[85,42],[30,18],[70,18]],
      "4-3-3":   [[50,88],[15,65],[35,65],[65,65],[85,65],[25,45],[50,42],[75,45],[25,18],[50,15],[75,18]],
      "4-2-3-1": [[50,88],[15,65],[35,65],[65,65],[85,65],[35,52],[65,52],[20,35],[50,32],[80,35],[50,15]],
      "3-5-2":   [[50,88],[25,68],[50,65],[75,68],[15,45],[35,42],[55,40],[75,42],[90,45],[35,18],[65,18]],
      "5-3-2":   [[50,88],[10,65],[28,68],[50,70],[72,68],[90,65],[25,45],[50,42],[75,45],[35,18],[65,18]],
    };

    const FORMATION_SLOT_POSITIONS = {
      "4-4-2":   ["GK", "LB", "CB", "CB", "RB", "LM", "CM", "CM", "RM", "ST", "ST"],
      "4-3-3":   ["GK", "LB", "CB", "CB", "RB", "CM", "CM", "CM", "LW", "ST", "RW"],
      "4-2-3-1": ["GK", "LB", "CB", "CB", "RB", "CM", "CM", "LM", "CAM", "RM", "ST"],
      "3-5-2":   ["GK", "CB", "CB", "CB", "LM", "CM", "CM", "CM", "RM", "ST", "ST"],
      "5-3-2":   ["GK", "LB", "CB", "CB", "CB", "RB", "CM", "CM", "CM", "ST", "ST"]
    };

    const rarityBorders = { 
      common: "border-zinc-400", 
      rare: "border-blue-400", 
      epic: "border-purple-400", 
      legendary: "border-amber-400" 
    };

    let team = { name: "Моят Клуб (Academy 3)", formation: "4-4-2", currentSeason: 1 };
    let isUserCaptain = true; 
    let currentCaptainName = "Иван Петров (Ти)";

    let realPlayers = [];
    const positionsList = ["GK", "CB", "LB", "RB", "CM", "CAM", "ST", "RW", "LW"];
    const rarities = ["common", "rare", "epic", "legendary"];
    
    for (let i = 1; i <= 28; i++) {
      realPlayers.push({
        id: i,
        name: `Член Фамилия ${i}`,
        overall_rating: Math.floor(Math.random() * 20) + 70,
        rarity: rarities[Math.floor(Math.random() * rarities.length)],
        position: positionsList[Math.floor(Math.random() * positionsList.length)]
      });
    }

    let lineup = new Array(11).fill(null);
    let selectedPlayer = null;
    let view = "pitch";

    document.getElementById("formation-select").onchange = (e) => {
      if (!isUserCaptain) {
        alert("Само спечелилият вота капитан може да променя формацията!");
        document.getElementById("formation-select").value = team.formation;
        return;
      }
      team.formation = e.target.value;
      render();
    };

    function toggleMyCaptaincy() {
      isUserCaptain = !isUserCaptain;
      currentCaptainName = isUserCaptain ? "Иван Петров (Ти)" : "Друг избран член (от вота)";
      render();
    }

    function autoFillLineup() {
      if (!isUserCaptain) {
        alert("Само капитанът може да използва автоматичното попълване!");
        return;
      }

      const slotRoles = FORMATION_SLOT_POSITIONS[team.formation] || FORMATION_SLOT_POSITIONS["4-4-2"];

      for (let i = 0; i < lineup.length; i++) {
        if (lineup[i] === null) {
          const requiredPos = slotRoles[i];
          const availableBench = realPlayers.filter(p => !lineup.includes(p.id));
          
          let bestMatch = availableBench
            .filter(p => p.position === requiredPos)
            .sort((a, b) => b.overall_rating - a.overall_rating)[0];

          if (bestMatch) {
            lineup[i] = bestMatch.id;
          }
        }
      }

      for (let i = 0; i < lineup.length; i++) {
        if (lineup[i] === null) {
          const availableBench = realPlayers.filter(p => !lineup.includes(p.id));
          if (availableBench.length === 0) break;
          availableBench.sort((a, b) => b.overall_rating - a.overall_rating);
          lineup[i] = availableBench[0].id;
        }
      }

      render();
    }

    function setView(newView) {
      view = newView;
      const buttons = document.querySelectorAll(".view-toggle button");
      buttons.forEach((btn, idx) => {
        btn.className = (idx === 0 && view === "pitch") || (idx === 1 && view === "list") ? "view-btn active" : "view-btn inactive";
      });
      render();
    }

    function setSelectedPlayer(player) { selectedPlayer = player; renderModal(); }
    function closeModal() { selectedPlayer = null; renderModal(); }
    function closeModalOnBackdrop(e) { if (e.target.id === "player-modal") closeModal(); }

    function handleDragStart(e, playerId) {
      if (!isUserCaptain) return;
      e.dataTransfer.setData("text/plain", playerId);
    }

    function allowDrop(e) { 
      if (isUserCaptain) e.preventDefault(); 
    }

    function dropToPitch(e, slotIndex) {
      e.preventDefault();
      if (!isUserCaptain) return;
      const playerId = parseInt(e.dataTransfer.getData("text/plain"));
      if (!playerId) return;

      const existingIndex = lineup.indexOf(playerId);
      if (existingIndex !== -1) {
        lineup[existingIndex] = null;
      }

      lineup[slotIndex] = playerId;
      render();
    }

    function toggleSquadFromModal(player) {
      if (!isUserCaptain) {
        alert("Нямате права! Само капитанът, избран с вот за сезона, може да сменя състава.");
        return;
      }

      const isInSquad = lineup.includes(player.id);
      if (isInSquad) {
        const index = lineup.indexOf(player.id);
        lineup[index] = null;
      } else {
        const emptyIndex = lineup.indexOf(null);
        if (emptyIndex !== -1) {
          lineup[emptyIndex] = player.id;
        }
      }
      selectedPlayer = null;
      render();
      renderModal();
    }

    function renderModal() {
      const modal = document.getElementById("player-modal");
      if (!selectedPlayer) { modal.classList.remove("open"); return; }
      modal.classList.add("open");
      document.getElementById("modal-player-name").innerText = selectedPlayer.name;

      document.getElementById("modal-card-container").innerHTML = createPlayerCardHTML(selectedPlayer);

      const isInSquad = lineup.includes(selectedPlayer.id);
      const btn = document.getElementById("modal-action-btn");
      
      if (!isUserCaptain) {
        btn.innerText = "Само капитанът може да сменя";
        btn.className = "btn-action default";
        btn.disabled = true;
      } else {
        btn.disabled = false;
        if (isInSquad) {
          btn.innerText = "Върни в резервите";
          btn.className = "btn-action destructive";
        } else {
          btn.innerText = "Попълни в състава";
          btn.className = "btn-action default";
        }
      }
      btn.onclick = () => toggleSquadFromModal(selectedPlayer);
    }

    function createPlayerCardHTML(player) {
      const borderColorClass = rarityBorders[player.rarity] || "border-zinc-400";
      const cursorStyle = isUserCaptain ? "cursor: grab;" : "cursor: pointer;";
      return `
        <div class="mock-player-card" draggable="${isUserCaptain}" ondragstart="handleDragStart(event, ${player.id})" style="${cursorStyle}">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; font-size: 13px;">${player.name}</span>
            <span style="font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.05); border-radius: 6px;">${player.position}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid;" class="${borderColorClass} flex items-center justify-center font-bold text-xs">
              ${player.overall_rating}
            </div>
            <span style="font-size: 10px; color: var(--muted-foreground);">Позиция: ${player.position}</span>
          </div>
        </div>
      `;
    }

    function render() {
      document.getElementById("team-name").innerText = team.name;
      document.getElementById("formation-select").value = team.formation;
      document.getElementById("season-title").innerText = `🏆 Сезон ${team.currentSeason} (Календар)`;
      document.getElementById("captain-name-text").innerText = `Капитан: ${currentCaptainName}`;

      const totalMembers = realPlayers.length;
      const activePitchCount = lineup.filter(id => id !== null).length;

      document.getElementById("total-members-count").innerText = totalMembers;
      document.getElementById("pitch-active-count").innerText = activePitchCount;
      document.getElementById("progress-fill").style.width = `${(totalMembers / 50) * 100}%`;

      const mainContainer = document.getElementById("main-view-container");
      const positions = FORMATION_POSITIONS[team.formation] || FORMATION_POSITIONS["4-4-2"];

      if (view === "pitch") {
        let slotsHTML = "";
        positions.forEach((pos, i) => {
          const playerId = lineup[i];
          const realPlayer = realPlayers.find(p => p.id === playerId);

          if (realPlayer) {
            const borderClass = rarityBorders[realPlayer.rarity] || "border-zinc-400";
            const cursorGrab = isUserCaptain ? "cursor: grab;" : "cursor: pointer;";
            slotsHTML += `
              <div class="pitch-slot" style="left: ${pos[0]}%; top: ${pos[1]}%;" 
                   ondragover="allowDrop(event)" ondrop="dropToPitch(event, ${i})">
                <button class="player-bubble" draggable="${isUserCaptain}" ondragstart="handleDragStart(event, ${realPlayer.id})" onclick='setSelectedPlayer(${JSON.stringify(realPlayer)})' style="background:none; border:none; ${cursorGrab}">
                  <div class="player-avatar ${borderClass}">
                    <span>${realPlayer.overall_rating}</span>
                  </div>
                  <div class="player-label">
                    <p>${realPlayer.name.split(" ")[0]} (${realPlayer.position})</p>
                  </div>
                </button>
              </div>
            `;
          } else {
            slotsHTML += `
              <div class="pitch-slot" style="left: ${pos[0]}%; top: ${pos[1]}%;" 
                   ondragover="allowDrop(event)" ondrop="dropToPitch(event, ${i})">
                <div class="player-bubble" style="cursor:default;">
                  <div class="bot-avatar"><span>🤖</span></div>
                  <div class="bot-label"><p>Празно</p></div>
                </div>
              </div>
            `;
          }
        });

        mainContainer.innerHTML = `
          <div class="pitch-wrapper">
            <div class="pitch-bg">
              <svg style="position:absolute; inset:0; width:100%; height:100%; opacity:0.2;" viewBox="0 0 100 140" preserveAspectRatio="none">
                <rect x="1" y="1" width="98" height="138" fill="none" stroke="white" stroke-width="0.8" />
                <line x1="1" y1="70" x2="99" y2="70" stroke="white" stroke-width="0.6" />
                <circle cx="50" cy="70" r="12" fill="none" stroke="white" stroke-width="0.6" />
                <circle cx="50" cy="70" r="1" fill="white" />
                <rect x="25" y="1" width="50" height="18" fill="none" stroke="white" stroke-width="0.6" />
                <rect x="25" y="121" width="50" height="18" fill="none" stroke="white" stroke-width="0.6" />
                <rect x="35" y="1" width="30" height="8" fill="none" stroke="white" stroke-width="0.6" />
                <rect x="35" y="131" width="30" height="8" fill="none" stroke="white" stroke-width="0.6" />
                <circle cx="50" cy="15" r="3" fill="none" stroke="white" stroke-width="0.5" />
                <circle cx="50" cy="125" r="3" fill="none" stroke="white" stroke-width="0.5" />
              </svg>
              ${slotsHTML}
            </div>
          </div>
        `;
      } else {
        const squadPlayers = realPlayers.filter(p => lineup.includes(p.id));
        if (squadPlayers.length === 0) {
          mainContainer.innerHTML = `<div class="empty-box"><p>Няма активни членове на терена.</p></div>`;
        } else {
          let listHTML = '<div class="cards-grid">';
          squadPlayers.forEach(player => {
            listHTML += `<div onclick='setSelectedPlayer(${JSON.stringify(player)})'>` + createPlayerCardHTML(player) + `</div>`;
          });
          listHTML += '</div>';
          mainContainer.innerHTML = listHTML;
        }
      }

      const benchPlayers = realPlayers.filter(p => !lineup.includes(p.id));
      document.getElementById("bench-heading").innerText = `Резерви / Клубни членове (${benchPlayers.length})`;
      
      const benchContainer = document.getElementById("bench-container");
      if (benchPlayers.length === 0) {
        benchContainer.style.display = "block";
        benchContainer.innerHTML = `<div class="empty-box" style="grid-column: span 3;"><p>Всички членове са на терена.</p></div>`;
      } else {
        benchContainer.style.display = "grid";
        let benchHTML = "";
        benchPlayers.sort((a,b) => b.overall_rating - a.overall_rating).forEach(player => {
          benchHTML += `<div onclick='setSelectedPlayer(${JSON.stringify(player)})'>` + createPlayerCardHTML(player) + `</div>`;
        });
        benchContainer.innerHTML = benchHTML;
      }
    }

    render();
  </script>
</body>
</html>
