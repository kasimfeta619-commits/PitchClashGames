<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Team HTPL - Личен Профил</title>
    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { background: #0b0c10; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        
        .app-container { width: 100%; max-width: 420px; height: 100%; background: #121820; display: flex; flex-direction: column; position: relative; overflow-y: auto; padding-top: 45px; padding-bottom: 75px; }
        
        /* ТОЧЕН ОРИГИНАЛЕН ТОП БАР ОТ INDEX И TEAM */
        .top-bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #1f2833; border-bottom: 1px solid #2c3542; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .res-item { display: flex; align-items: center; gap: 3px; font-weight: bold; }
        .shop-link-btn { background: #66fcf1; border: none; color: #0b0c10; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; text-decoration: none; }

        .content-wrap { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

        .profile-main-card { background: linear-gradient(135deg, #1f2833, #121820); border: 1px solid #66fcf1; border-radius: 12px; padding: 20px; text-align: center; }
        .avatar-circle { width: 60px; height: 60px; background: #66fcf1; color: #0b0c10; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto 10px auto; border: 2px solid #fff; }
        .p-title-name { font-size: 18px; font-weight: bold; margin-bottom: 3px; color: #fff; }
        .p-title-team { font-size: 12px; color: #66fcf1; margin-bottom: 12px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat-box { background: #1f2833; border: 1px solid #2c3542; padding: 10px; border-radius: 10px; text-align: center; }
        .stat-val { font-size: 16px; font-weight: bold; color: #fff; margin-top: 3px; }
        .stat-lbl { font-size: 9px; color: #a5b1c2; text-transform: uppercase; }

        .section-title { font-size: 12px; font-weight: bold; color: #ffb703; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .settings-card { background: #1f2833; border: 1px solid #2c3542; border-radius: 12px; padding: 14px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 10px; color: #a5b1c2; margin-bottom: 4px; }
        .form-input { width: 100%; background: #121820; border: 1px solid #2c3542; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 11px; }
        .form-input:focus { border-color: #66fcf1; outline: none; }
        .save-btn { width: 100%; background: #66fcf1; color: #0b0c10; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 5px; }
        .save-btn:hover { background: #45a29e; }

        /* НАВИГАЦИОНЕН БАР КАТО В INDEX И TEAM */
        .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; display: flex; justify-content: space-around; background: #1f2833; border-top: 1px solid #2c3542; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); }
        .nav-item { color: #a5b1c2; text-decoration: none; font-size: 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
        .nav-item.active { color: #66fcf1; }
        .nav-item span { font-size: 14px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- ТОЧЕН ОРИГИНАЛЕН ТОП БАР С РЕСУРСИ -->
    <div class="top-bar">
        <div class="res-item" style="color: #ffb703;">⚡ <span id="topEnergy">180/180</span></div>
        <div class="res-item" style="color: #2ecc71;">💵 <span id="topCash">500</span></div>
        <div class="res-item" style="color: #9b59b6;">💎 <span id="topDiamonds">10</span></div>
        <div class="res-item" style="color: #66fcf1;">⭐ <span id="topStars">1</span></div>
        <a href="shop.html" class="shop-link-btn">Магазин</a>
    </div>

    <div class="content-wrap">
        
        <!-- ПРОФИЛНА ГЛАВНА КАРТА -->
        <div class="profile-main-card">
            <div class="avatar-circle" id="avatarLetter">N</div>
            <div class="p-title-name" id="profileName">Nonames</div>
            <div class="p-title-team" id="profileTeam">Капитан на ФК Пълен Блок</div>
            <div style="font-size: 10px; color: #a5b1c2;">Ранг в лигата: <b style="color: #66fcf1;">Елиттен Капитан</b></div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-lbl">Рейтинг</div>
                <div class="stat-val" id="statOvr" style="color: #66fcf1;">125</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl">Натрупан XP</div>
                <div class="stat-val" id="statXp">30721</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl">Сезонен Ден</div>
                <div class="stat-val" id="statDay">2/14</div>
            </div>
        </div>

        <!-- НАСТРОЙКИ И ПРОМЯНА НА ИМЕНА -->
        <div class="section-title">⚙️ Настройки на профила</div>
        <div class="settings-card">
            <div class="form-group">
                <label>Име на играч / Капитан</label>
                <input type="text" id="inputName" class="form-input" value="Nonames">
            </div>
            <div class="form-group">
                <label>Име на отбора</label>
                <input type="text" id="inputTeam" class="form-input" value="ФК Пълен Блок">
            </div>
            <button class="save-btn" onclick="saveProfileChanges()">Запази промените</button>
        </div>

    </div>

    <!-- НАВИГАЦИОНЕН БАР -->
    <div class="nav-bar">
        <a href="matches.html" class="nav-item"><span>⚽</span> Мачове</a>
        <a href="training.html" class="nav-item"><span>🏋️</span> Трен.</a>
        <a href="index.html" class="nav-item"><span>🏠</span> Хъб</a>
        <a href="team.html" class="nav-item"><span>👥</span> Отборът</a>
        <a href="profile.html" class="nav-item active"><span>👤</span> Профил</a>
    </div>

</div>

<script>
    const MAX_ENERGY = 180;
    let energy = parseInt(localStorage.getItem('energy')) || MAX_ENERGY;
    let cash = parseInt(localStorage.getItem('cash')) || 500;
    let diamonds = localStorage.getItem('diamonds') !== null ? parseInt(localStorage.getItem('diamonds')) : 10;
    let stars = parseInt(localStorage.getItem('stars')) || 1;
    
    let xp = parseInt(localStorage.getItem('playerXp')) || 30721;
    let trainingDay = parseInt(localStorage.getItem('trainingDay')) || 2;
    
    let userName = localStorage.getItem('playerName') || "Nonames";
    let teamName = localStorage.getItem('playerTeam') || "ФК Пълен Блок";

    // Автоматично изчисляване на средния рейтинг (OVR) от титулярите на терена
    let starters = JSON.parse(localStorage.getItem('pitchStarters'));
    let calculatedOvr = 125;
    if (starters && starters.length > 0) {
        let sumOvr = starters.reduce((acc, p) => acc + (p.ovr || p.baseOvr || 50), 0);
        calculatedOvr = Math.round(sumOvr / starters.length);
    }

    // Попълване на UI елементите
    document.getElementById('topEnergy').innerText = energy + "/" + MAX_ENERGY;
    document.getElementById('topDiamonds').innerText = diamonds;
    document.getElementById('topCash').innerText = cash;
    document.getElementById('topStars').innerText = stars;
    
    document.getElementById('profileName').innerText = userName;
    document.getElementById('profileTeam').innerText = "Капитан на " + teamName;
    document.getElementById('avatarLetter').innerText = userName.charAt(0).toUpperCase();

    document.getElementById('statOvr').innerText = calculatedOvr;
    document.getElementById('statXp').innerText = xp;
    document.getElementById('statDay').innerText = trainingDay + "/14";

    document.getElementById('inputName').value = userName;
    document.getElementById('inputTeam').value = teamName;

    function saveProfileChanges() {
        let newName = document.getElementById('inputName').value.trim();
        let newTeam = document.getElementById('inputTeam').value.trim();

        if (!newName || !newTeam) {
            alert("Моля, попълни и двете полета!");
            return;
        }

        localStorage.setItem('playerName', newName);
        localStorage.setItem('playerTeam', newTeam);

        alert("Промените са запазени успешно!");
        location.reload();
    }
</script>

</body>
</html>
