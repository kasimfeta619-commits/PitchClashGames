<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Clash - Магазин</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #111418;
      margin: 0;
      min-height: 100vh;
    }
    /* HomeBar стилове */
    .home-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1B2028;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 64px;
      padding: 4px 0;
      border-radius: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      color: #ffffff;
    }
    .nav-btn.active {
      color: #00e6c3;
      background-color: rgba(0, 137, 123, 0.15);
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-btn span {
      font-size: 10px;
      font-weight: 600;
      font-family: sans-serif;
    }
  </style>
</head>
<body class="text-white min-h-screen px-3 py-4 pb-24 font-sans" onload="init()">

  <div class="max-w-md mx-auto space-y-4">

    <!-- ГОРЕН УНИФИЦИРАН HEADER BAR -->
    <div class="space-y-2">
      <div class="relative w-full bg-[#1c2128] border border-white/10 rounded-full p-1 flex items-center shadow-inner">
        <div class="absolute -left-1 flex items-center gap-1 bg-[#1c2128] border border-amber-500/50 px-2.5 py-1 rounded-full text-amber-400 font-bold text-xs shadow-md z-10">
          <span>★</span>
          <span id="player-level">1</span>
        </div>
        <div class="w-full bg-[#252b36] rounded-full h-5 relative overflow-hidden flex items-center justify-center">
          <div id="xp-fill" class="absolute left-0 top-0 bottom-0 bg-amber-400 rounded-full transition-all" style="width: 35%;"></div>
          <span id="xp-text" class="relative z-10 text-[11px] font-bold text-black">150 / 400</span>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto">
        <div class="flex items-center gap-2 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5 flex-1 min-w-[110px]">
          <span class="text-[#00c5bd] text-sm">⚡</span>
          <div class="flex-1 bg-black/50 rounded-full h-2 overflow-hidden">
            <div id="energy-fill" class="bg-[#00c5bd] h-full rounded-full transition-all" style="width: 100%;"></div>
          </div>
          <span class="text-xs font-bold text-white"><span id="player-energy">100</span>/<span id="player-max-energy">100</span></span>
        </div>

        <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
          <span class="text-amber-500 text-sm">🪙</span>
          <span id="player-coins" class="text-xs font-bold text-white">500</span>
        </div>

        <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
          <span class="text-[#40c4ff] text-sm">💎</span>
          <span id="player-gems" class="text-xs font-bold text-white">10</span>
        </div>
      </div>
    </div>

    <!-- Заглавие -->
    <div>
      <h1 class="text-xl font-bold">Магазин</h1>
      <p class="text-xs text-gray-400">Пакети, енергия и награди</p>
    </div>

    <!-- Баланс картите -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-3 flex items-center gap-1.5">
        <span class="text-lg">🪙</span>
        <div class="min-w-0">
          <p class="text-[10px] text-gray-400">Злато</p>
          <p id="shop-coins" class="font-bold text-sm truncate">5,000</p>
        </div>
      </div>
      <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-3 flex items-center gap-1.5">
        <span class="text-cyan-400 text-lg">💎</span>
        <div class="min-w-0">
          <p class="text-[10px] text-gray-400">Диаманти</p>
          <p id="shop-gems" class="font-bold text-sm truncate">10</p>
        </div>
      </div>
      <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-3 flex items-center gap-1.5">
        <span class="text-yellow-400 text-lg">⚡</span>
        <div class="min-w-0">
          <p class="text-[10px] text-gray-400">Енергия</p>
          <p id="shop-energy" class="font-bold text-sm truncate">100</p>
        </div>
      </div>
    </div>

    <!-- Активен агент банър (ако има такъв) -->
    <div id="active-agent-banner" class="hidden bg-[#00c5bd]/10 border border-[#00c5bd]/30 rounded-2xl p-3 items-center gap-3">
      <span id="active-agent-icon" class="text-2xl"></span>
      <div class="flex-1">
        <p id="active-agent-title" class="font-semibold text-[#00c5bd] text-sm"></p>
        <p id="active-agent-desc" class="text-xs text-gray-400"></p>
      </div>
      <div id="active-agent-time" class="flex items-center gap-1 text-xs text-amber-400 font-semibold"></div>
    </div>

    <!-- Изскачащо съобщение (Flash) -->
    <div id="flash-box" class="hidden bg-[#00c5bd]/15 border border-[#00c5bd]/40 rounded-2xl p-3 items-center gap-2">
      <span class="text-[#00c5bd] font-bold">✓</span>
      <p id="flash-text" class="text-[#00c5bd] font-semibold text-xs"></p>
    </div>

    <!-- Табове -->
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="switchTab('energy')" id="tab-btn-energy" class="py-2 rounded-xl font-bold text-[10px] transition-all bg-[#00c5bd] text-black cursor-pointer">⚡ Енергия</button>
      <button onclick="switchTab('agents')" id="tab-btn-agents" class="py-2 rounded-xl font-bold text-[10px] transition-all bg-[#1c2128] border border-white/10 text-gray-400 cursor-pointer">🧑‍🏫 Агенти</button>
      <button onclick="switchTab('awards')" id="tab-btn-awards" class="py-2 rounded-xl font-bold text-[10px] transition-all bg-[#1c2128] border border-white/10 text-gray-400 cursor-pointer">🏆 Награди</button>
      <button onclick="switchTab('offers')" id="tab-btn-offers" class="py-2 rounded-xl font-bold text-[10px] transition-all bg-[#1c2128] border border-white/10 text-gray-400 cursor-pointer">🎁 Оферти</button>
    </div>

    <!-- СЪДЪРЖАНИЕ НА ТАБОВЕТЕ -->
    <div id="tab-content" class="space-y-3">
      <!-- Динамично зареждане -->
    </div>

  </div>

  <!-- Долна навигационна лента -->
  <nav class="home-bar">
    <a href="matches.html" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6m12 5h1.5a2.5 2.5 0 000-5H18M6 4h12v6a6 6 0 01-12 0V4zm6 11v4m-3 0h6"></path></svg>
      <span>Мачове</span>
    </a>
    <a href="training.html" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h-3a1 1 0 00-1 1v10a1 1 0 001 1h3M17.5 6h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6.5 12h11M2 10h2v4H2zm18 0h2v4h-2z"></path></svg>
      <span>Трен.</span>
    </a>
    <a href="index.html" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Начало</span>
    </a>
    <a href="team.html" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span>Отбор</span>
    </a>
    <a href="profile.html" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Профил</span>
    </a>
  </nav>

  <script>
    const ENERGY_PACKS = [
      { id: "e10", energy: 10, coins: 30, label: "Малко" },
      { id: "e25", energy: 25, coins: 70, label: "Средно" },
      { id: "e50", energy: 50, coins: 130, label: "Голямо" },
      { id: "e100", energy: 100, coins: 240, label: "Пълно", highlight: true },
      { id: "e200", energy: 200, coins: 450, label: "Мега", highlight: true },
      { id: "e500", energy: 500, coins: 1000, label: "Ултра", highlight: true },
    ];

    const AGENT_DURATION_MS = 3.5 * 60 * 60 * 1000; // 3.5 hours
    const AGENTS = [
      { id: "agent1", name: "Агент Ниво 1", icon: "🥉", bonus: 1, cost: 100, desc: "+1 стат • 3.5ч" },
      { id: "agent2", name: "Агент Ниво 2", icon: "🥈", bonus: 2, cost: 500, desc: "+2 стат • 3.5ч" },
      { id: "agent3", name: "Агент Ниво 3", icon: "🏅", bonus: 3, cost: 1000, desc: "+3 стат • 3.5ч" },
      { id: "agent4", name: "Агент Ниво 4", icon: "🎖️", bonus: 4, cost: 2000, desc: "+4 стат • 3.5ч" },
      { id: "agent5", name: "Агент Ниво 5", icon: "🥇", bonus: 5, cost: 3000, desc: "+5 стат • 3.5ч" },
      { id: "agent6", name: "Агент Ниво 6", icon: "👑", bonus: 6, cost: 4000, desc: "+6 стат • 3.5ч" },
      { id: "agent7", name: "Агент Ниво 7", icon: "💎", bonus: 7, cost: 5000, desc: "+7 стат • 3.5ч" },
    ];

    const AWARDS = [
      { id: "golden_boot", name: "Златна Обувка", icon: "👟", desc: "Награда за топ голмайстор — +5 Атака завинаги", cost: 3000, color: "from-yellow-600 to-yellow-800 border-yellow-500/40", statBoost: { attack: 5 }, field: "award_golden_boot" },
      { id: "golden_ball", name: "Златна Топка", icon: "⚽", desc: "Награда за най-добър играч — +5 Техника завинаги", cost: 5000, color: "from-amber-500 to-orange-700 border-amber-400/40", statBoost: { technique: 5 }, field: "award_golden_ball" },
      { id: "training_medal", name: "Тренировъчен Медал", icon: "🏅", desc: "Отличие за упорит труд — +5 Издръжливост завинаги", cost: 2000, color: "from-slate-600 to-slate-800 border-slate-400/30", statBoost: { stamina: 5 }, field: "award_training_medal" },
    ];

    const OFFERS = [
      { id: "starter", name: "Стартов Пакет", icon: "🎁", desc: "200 ⚡ енергия + Треньор Про (3.5ч)", cost: 900, highlight: false, color: "border-blue-500/30 bg-blue-500/5" },
      { id: "champion", name: "Шампионски Пакет", icon: "🏆", desc: "500 ⚡ + Треньор Елит (3.5ч) + 500🪙", cost: 2500, highlight: true, color: "border-amber-500/40 bg-amber-500/8" },
      { id: "legend", name: "Легендарен Пакет", icon: "👑", desc: "1000 ⚡ + Легендарен Агент (3.5ч) + 1500🪙", cost: 6000, highlight: true, color: "border-purple-500/40 bg-purple-500/8" },
    ];

    let player = JSON.parse(localStorage.getItem('pitch_clash_player')) || {
      energy: 100,
      maxEnergy: 100,
      coins: 1250,
      gems: 10,
      level: 1,
      xp: 150,
      attack: 40,
      technique: 40,
      stamina: 40
    };

    let currentTab = "energy";
    let now = Date.now();

    function init() {
      setInterval(() => {
        now = Date.now();
        updateActiveAgentBanner();
      }, 10000);
      updateUI();
      switchTab('energy');
    }

    function savePlayer() {
      localStorage.setItem('pitch_clash_player', JSON.stringify(player));
    }

    function updateUI() {
      document.getElementById("player-level").innerText = player.level || 1;
      document.getElementById("player-energy").innerText = player.energy;
      document.getElementById("player-max-energy").innerText = player.maxEnergy || 100;
      document.getElementById("energy-fill").style.width = ((player.energy / (player.maxEnergy || 100)) * 100) + "%";
      document.getElementById("player-coins").innerText = (player.coins || 0).toLocaleString();
      document.getElementById("player-gems").innerText = player.gems || 0;
      document.getElementById("shop-coins").innerText = (player.coins || 0).toLocaleString();
      document.getElementById("shop-gems").innerText = player.gems || 0;
      document.getElementById("shop-energy").innerText = player.energy;
      document.getElementById("xp-text").innerText = `${player.xp || 150} / 400`;
      document.getElementById("xp-fill").style.width = (((player.xp || 150) / 400) * 100) + "%";
      updateActiveAgentBanner();
    }

    function isAgentActive(agentId) {
      if (!player || player.agent_id !== agentId) return false;
      if (!player.agent_expires) return true;
      return new Date(player.agent_expires).getTime() > now;
    }

    function agentTimeLeft(agentId) {
      if (!player || player.agent_id !== agentId || !player.agent_expires) return null;
      const diff = new Date(player.agent_expires).getTime() - now;
      if (diff <= 0) return null;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return `${h}ч ${m}м`;
    }

    function updateActiveAgentBanner() {
      const activeAgent = AGENTS.find(a => isAgentActive(a.id));
      const banner = document.getElementById("active-agent-banner");
      if (activeAgent) {
        banner.className = "flex bg-[#00c5bd]/10 border border-[#00c5bd]/30 rounded-2xl p-3 items-center gap-3 shadow-md";
        document.getElementById("active-agent-icon").innerText = activeAgent.icon;
        document.getElementById("active-agent-title").innerText = `Активен: ${activeAgent.name}`;
        document.getElementById("active-agent-desc").innerText = activeAgent.desc;
        document.getElementById("active-agent-time").innerHTML = `⏰ ${agentTimeLeft(activeAgent.id) || ''}`;
      } else {
        banner.className = "hidden bg-[#00c5bd]/10 border border-[#00c5bd]/30 rounded-2xl p-3 items-center gap-3";
      }
    }

    function showFlash(msg) {
      const box = document.getElementById("flash-box");
      document.getElementById("flash-text").innerText = msg;
      box.classList.remove("hidden");
      box.classList.add("flex");
      setTimeout(() => {
        box.classList.remove("flex");
        box.classList.add("hidden");
      }, 2500);
    }

    function switchTab(tab) {
      currentTab = tab;
      ['energy', 'agents', 'awards', 'offers'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = "py-2 rounded-xl font-bold text-[10px] transition-all bg-[#00c5bd] text-black cursor-pointer shadow-sm";
        } else {
          btn.className = "py-2 rounded-xl font-bold text-[10px] transition-all bg-[#1c2128] border border-white/10 text-gray-400 cursor-pointer";
        }
      });
      renderTabContent();
    }

    function renderTabContent() {
      const container = document.getElementById("tab-content");
      container.innerHTML = "";

      if (currentTab === "energy") {
        const grid = document.createElement("div");
        grid.className = "grid grid-cols-3 gap-2";
        ENERGY_PACKS.forEach(pack => {
          const canAfford = (player.coins || 0) >= pack.coins;
          const card = document.createElement("div");
          card.className = `rounded-2xl p-3 border flex flex-col items-center gap-1 transition-all shadow-sm ${pack.highlight ? "bg-amber-500/15 border-amber-500/40" : "bg-[#1c2128] border-white/10"} ${!canAfford ? "opacity-40" : ""}`;
          card.innerHTML = `
            <span class="text-2xl">⚡</span>
            <p class="font-bold text-lg leading-none text-white">+${pack.energy}</p>
            <p class="text-[9px] font-bold px-1.5 py-0.5 rounded-full ${pack.highlight ? "bg-amber-500/30 text-amber-300" : "bg-gray-800 text-gray-300"}">${pack.label}</p>
            <p class="text-xs font-bold mt-0.5 text-white">🪙 ${pack.coins}</p>
            <button onclick="buyEnergy('${pack.id}')" ${!canAfford ? 'disabled' : ''} class="mt-1 w-full py-1 bg-[#00c5bd] hover:bg-[#00a8a0] disabled:bg-gray-800 disabled:text-gray-600 text-black font-bold text-[10px] rounded-lg cursor-pointer">Купи</button>
          `;
          grid.appendChild(card);
        });
        container.appendChild(grid);
      } 
      else if (currentTab === "agents") {
        const wrapper = document.createElement("div");
        wrapper.className = "space-y-3";
        wrapper.innerHTML = `<p class="text-xs text-gray-400">Агентите действат 3.5 часа след покупката.</p>`;
        
        AGENTS.forEach(agent => {
          const active = isAgentActive(agent.id);
          const timeLeft = agentTimeLeft(agent.id);
          const canAfford = (player.coins || 0) >= agent.cost;
          
          let starsHtml = "";
          for(let i=0; i<7; i++) {
            starsHtml += `<div class="w-2.5 h-1 rounded-full ${i < agent.bonus ? "bg-[#00c5bd]" : "bg-gray-800"}"></div>`;
          }

          const card = document.createElement("div");
          card.className = `bg-[#1c2128] border rounded-2xl p-4 flex items-center gap-3 shadow-md ${active ? "border-[#00c5bd]/40" : "border-white/10"}`;
          card.innerHTML = `
            <span class="text-3xl">${agent.icon}</span>
            <div class="flex-1 min-w-0">
              <p class="font-bold text-sm text-white">${agent.name}</p>
              <p class="text-xs text-gray-400">${agent.desc}</p>
              <div class="flex mt-1 gap-1">${starsHtml}</div>
            </div>
            <div class="text-right flex-shrink-0">
              ${active ? `
                <p class="text-[#00c5bd] text-xs font-bold">✓ Активен</p>
                ${timeLeft ? `<p class="text-amber-400 text-[10px] flex items-center gap-0.5 justify-end mt-0.5">⏰ ${timeLeft}</p>` : ''}
              ` : `
                <button onclick="buyAgent('${agent.id}')" ${!canAfford ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${canAfford ? "bg-[#00c5bd] text-black cursor-pointer" : "bg-gray-800 text-gray-500"}">
                  🪙 ${agent.cost.toLocaleString()}
                </button>
              `}
            </div>
          `;
          wrapper.appendChild(card);
        });
        container.appendChild(wrapper);
      }
      else if (currentTab === "awards") {
        const wrapper = document.createElement("div");
        wrapper.className = "space-y-3";
        
        AWARDS.forEach(award => {
          const owned = !!player[award.field];
          const canAfford = (player.coins || 0) >= award.cost;

          const card = document.createElement("div");
          card.className = `bg-gradient-to-r ${award.color} border rounded-2xl p-4 flex items-center gap-3 shadow-lg`;
          card.innerHTML = `
            <span class="text-4xl">${award.icon}</span>
            <div class="flex-1 min-w-0">
              <p class="font-bold text-base text-white">${award.name}</p>
              <p class="text-xs text-white/70 mt-0.5">${award.desc}</p>
            </div>
            <div class="text-right flex-shrink-0">
              ${owned ? `
                <span class="text-amber-300 font-bold text-xs">✓ Притежавана</span>
              ` : `
                <button onclick="buyAward('${award.id}')" ${!canAfford ? 'disabled' : ''} class="px-3 py-2 rounded-xl text-xs font-bold transition-all ${canAfford ? "bg-white/20 border border-white/30 text-white cursor-pointer" : "bg-white/5 text-white/30 border border-white/10"}">
                  🪙 ${award.cost.toLocaleString()}
                </button>
              `}
            </div>
          `;
          wrapper.appendChild(card);
        });
        container.appendChild(wrapper);
      }
      else if (currentTab === "offers") {
        const wrapper = document.createElement("div");
        wrapper.className = "space-y-3";

        OFFERS.forEach(offer => {
          const canAfford = (player.coins || 0) >= offer.cost;
          const card = document.createElement("div");
          card.className = `border rounded-2xl p-4 shadow-md ${offer.color}`;
          card.innerHTML = `
            <div class="flex items-center gap-3 mb-3">
              <span class="text-3xl">${offer.icon}</span>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <p class="font-bold text-base text-white">${offer.name}</p>
                  ${offer.highlight ? '<span class="text-[9px] bg-amber-500 text-black font-bold px-1.5 py-0.5 rounded-full">ПРЕПОРЪЧАН</span>' : ''}
                </div>
                <p class="text-xs text-gray-400 mt-0.5">${offer.desc}</p>
              </div>
            </div>
            <button onclick="buyOffer('${offer.id}')" ${!canAfford ? 'disabled' : ''} class="w-full h-10 rounded-xl font-bold text-sm transition-all ${canAfford ? "bg-[#00c5bd] text-black cursor-pointer shadow-sm" : "bg-gray-800 text-gray-500"}">
              🪙 ${offer.cost.toLocaleString()} — Купи пакет
            </button>
          `;
          wrapper.appendChild(card);
        });
        container.appendChild(wrapper);
      }
    }

    function buyEnergy(packId) {
      const pack = ENERGY_PACKS.find(p => p.id === packId);
      if (!pack || player.coins < pack.coins) return;

      player.coins -= pack.coins;
      player.energy = (player.energy || 0) + pack.energy;
      savePlayer();
      updateUI();
      renderTabContent();
      showFlash(`+${pack.energy} ⚡ Енергия добавена!`);
    }

    function buyAgent(agentId) {
      const agent = AGENTS.find(a => p => p.id === agentId);
      const targetAgent = AGENTS.find(a => a.id === agentId);
      if (!targetAgent || player.coins < targetAgent.cost || isAgentActive(agentId)) return;

      player.coins -= targetAgent.cost;
      player.agent_id = targetAgent.id;
      player.agent_bonus = targetAgent.bonus;
      player.agent_expires = new Date(Date.now() + AGENT_DURATION_MS).toISOString();
      savePlayer();
      updateUI();
      renderTabContent();
      showFlash(`${targetAgent.icon} ${targetAgent.name} нает за 3.5ч!`);
    }

    function buyAward(awardId) {
      const award = AWARDS.find(a => a.id === awardId);
      if (!award || player.coins < award.cost || player[award.field]) return;

      player.coins -= award.cost;
      player[award.field] = true;
      Object.entries(award.statBoost).forEach(([k, v]) => {
        player[k] = (player[k] || 40) + v;
      });
      savePlayer();
      updateUI();
      renderTabContent();
      showFlash(`${award.icon} ${award.name} спечелена!`);
    }

    function buyOffer(offerId) {
      const offer = OFFERS.find(o => o.id === offerId);
      if (!offer || player.coins < offer.cost) return;

      player.coins -= offer.cost;
      if (offer.id === "starter") {
        player.energy = (player.energy || 0) + 200;
        player.agent_id = "agent2"; player.agent_bonus = 2;
        player.agent_expires = new Date(Date.now() + AGENT_DURATION_MS).toISOString();
      } else if (offer.id === "champion") {
        player.energy = (player.energy || 0) + 500;
        player.agent_id = "agent4"; player.agent_bonus = 4;
        player.agent_expires = new Date(Date.now() + AGENT_DURATION_MS).toISOString();
        player.coins += 500;
      } else if (offer.id === "legend") {
        player.energy = (player.energy || 0) + 1000;
        player.agent_id = "agent7"; player.agent_bonus = 7;
        player.agent_expires = new Date(Date.now() + AGENT_DURATION_MS).toISOString();
        player.coins += 1500;
      }

      savePlayer();
      updateUI();
      renderTabContent();
      showFlash(`${offer.icon} ${offer.name} активиран!`);
    }
  </script>
</body>
</html>
