<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeaderBar - Pitch Clash</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#111418] text-white min-h-screen p-4">

  <div class="max-w-md mx-auto space-y-2">
    
    <!-- ГОРЕН XP / НИВО БАР -->
    <div class="relative w-full bg-[#1c2128] border border-white/10 rounded-full p-1 flex items-center shadow-inner">
      <!-- Жълта звезда с ниво (фиксирано на 0) -->
      <div class="absolute -left-1 flex items-center gap-1 bg-[#1c2128] border border-amber-500/50 px-2.5 py-1 rounded-full text-amber-400 font-bold text-xs shadow-md z-10">
        <span>★</span>
        <span id="player-level">0</span>
      </div>

      <!-- Запълващ се жълт бар за опит -->
      <div class="w-full bg-[#252b36] rounded-full h-5 relative overflow-hidden flex items-center justify-center">
        <div id="xp-fill" class="absolute left-0 top-0 bottom-0 bg-amber-400 rounded-full transition-all" style="width: 0%;"></div>
        <!-- Текст за XP в средата на бара -->
        <span id="xp-text" class="relative z-10 text-[11px] font-bold text-black drop-name">0 / 100</span>
      </div>
    </div>

    <!-- ДОЛЕН РЕД (Енергия, Монети, Диаманти, Магазин) -->
    <div class="flex items-center gap-2 overflow-x-auto">
      
      <!-- Енергия (фиксирана на 100) -->
      <div class="flex items-center gap-2 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5 flex-1 min-w-[110px]">
        <span class="text-amber-400 text-sm">⚡</span>
        <div class="flex-1 bg-black/50 rounded-full h-2 overflow-hidden">
          <div id="energy-fill" class="bg-amber-400 h-full rounded-full" style="width: 100%;"></div>
        </div>
        <span id="player-energy" class="text-xs font-bold text-white">100</span>
      </div>

      <!-- Монети -->
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-amber-600 text-sm">🪙</span>
        <span id="player-coins" class="text-xs font-bold text-white">0</span>
      </div>

      <!-- Диаманти -->
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-[#40c4ff] text-sm">💎</span>
        <span id="player-gems" class="text-xs font-bold text-white">0</span>
      </div>

      <!-- Бутон Магазин -->
      <button onclick="openShop()" class="flex items-center gap-1.5 bg-[#7c3aed] hover:bg-[#6d28d9] transition-all text-white font-bold px-3.5 py-1.5 rounded-full text-xs shadow-md cursor-pointer flex-shrink-0">
        <span>🛒</span>
        <span>Магазин</span>
      </button>

    </div>

  </div>

  <!-- РЕАКТ КОМПОНЕНТ (Squad.jsx) -->
  <script type="text/javascript">
    import React, { useState, useEffect } from "react";
    import { base44 } from "@/api/base44Client";
    import PlayerCard from "@/components/cards/PlayerCard";
    import { Button } from "@/components/ui/button";
    import { Dialog, DialogContent, DialogHeader, DialogTitle } from "@/components/ui/dialog";
    import { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from "@/components/ui/select";
    import { Users, Filter, ChevronDown } from "lucide-react";

    const formations = ["4-4-2","4-3-3","3-5-2","4-2-3-1","5-3-2"];

    const FORMATION_POSITIONS = {
      "4-4-2":   [[50,88],[15,65],[35,65],[65,65],[85,65],[15,42],[35,42],[65,42],[85,42],[30,18],[70,18]],
      "4-3-3":   [[50,88],[15,65],[35,65],[65,65],[85,65],[25,45],[50,42],[75,45],[25,18],[50,15],[75,18]],
      "4-2-3-1": [[50,88],[15,65],[35,65],[65,65],[85,65],[35,52],[65,52],[20,35],[50,32],[80,35],[50,15]],
      "3-5-2":   [[50,88],[25,68],[50,65],[75,68],[15,45],[35,42],[55,40],[75,42],[90,45],[35,18],[65,18]],
      "5-3-2":   [[50,88],[10,65],[28,68],[50,70],[72,68],[90,65],[25,45],[50,42],[75,45],[35,18],[65,18]],
    };

    export default function Squad() {
      const [team, setTeam] = useState(null);
      const [players, setPlayers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedPlayer, setSelectedPlayer] = useState(null);
      const [filterPos, setFilterPos] = useState("all");
      const [view, setView] = useState("pitch");

      useEffect(() => { loadData(); }, []);

      async function loadData() {
        const user = await base44.auth.me();
        const teams = await base44.entities.Team.filter({ owner_id: user.id });
        if (teams.length > 0) setTeam(teams[0]);
        const myPlayers = await base44.entities.Player.filter({ owner_id: user.id });
        setPlayers(myPlayers);
        setLoading(false);
      }

      async function toggleSquad(player) {
        const squadCount = players.filter(p => p.in_squad && p.id !== player.id).length;
        if (!player.in_squad && squadCount >= 11) return;
        await base44.entities.Player.update(player.id, { in_squad: !player.in_squad });
        setPlayers(prev => prev.map(p => p.id === player.id ? { ...p, in_squad: !p.in_squad } : p));
        setSelectedPlayer(null);
      }

      async function changeFormation(formation) {
        await base44.entities.Team.update(team.id, { formation });
        setTeam(prev => ({ ...prev, formation }));
      }

      if (loading) return <div className="flex items-center justify-center min-h-screen"><div className="w-8 h-8 border-4 border-primary/30 border-t-primary rounded-full animate-spin" /></div>;

      const squadPlayers = players.filter(p => p.in_squad).sort((a,b) => b.overall_rating - a.overall_rating);
      const benchPlayers = players.filter(p => !p.in_squad);
      const filteredBench = filterPos === "all" ? benchPlayers : benchPlayers.filter(p => p.position === filterPos);
      const formation = team?.formation || "4-4-2";
      const positions = FORMATION_POSITIONS[formation] || FORMATION_POSITIONS["4-4-2"];

      return (
        <div className="max-w-2xl mx-auto px-4 py-6 space-y-5">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="font-display text-2xl font-bold">Отбор</h1>
              <p className="text-muted-foreground text-sm">{team?.name}</p>
            </div>
            <div className="flex items-center gap-2">
              <Select value={formation} onValueChange={changeFormation}>
                <SelectTrigger className="w-28 bg-card border-border rounded-xl">
                  <SelectValue />
                </SelectTrigger>
                <SelectContent>
                  {formations.map(f => <SelectItem key={f} value={f}>{f}</SelectItem>)}
                </SelectContent>
              </Select>
              <div className="flex rounded-xl overflow-hidden border border-border">
                {["pitch","list"].map(v => (
                  <button key={v} onClick={() => setView(v)} className={`px-3 py-2 text-xs font-semibold transition-colors ${view === v ? "bg-primary text-white" : "bg-card text-muted-foreground"}`}>
                    {v === "pitch" ? "⚽" : "📋"}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <Users className="w-4 h-4 text-primary" />
            <span className="font-display font-bold text-sm">Състав: {squadPlayers.length}/11</span>
            <div className="flex-1 h-1.5 bg-muted rounded-full overflow-hidden">
              <div className="h-full bg-primary rounded-full transition-all" style={{ width: `${(squadPlayers.length / 11) * 100}%` }} />
            </div>
          </div>

          {view === "pitch" ? (
            <div className="relative w-full rounded-2xl overflow-hidden" style={{ paddingBottom: "140%" }}>
              <div className="absolute inset-0 bg-gradient-to-b from-green-800 to-green-900">
                <svg className="absolute inset-0 w-full h-full opacity-20" viewBox="0 0 100 140" preserveAspectRatio="none">
                  <rect x="1" y="1" width="98" height="138" fill="none" stroke="white" strokeWidth="0.8" />
                  <line x1="1" y1="70" x2="99" y2="70" stroke="white" strokeWidth="0.6" />
                  <circle cx="50" cy="70" r="12" fill="none" stroke="white" strokeWidth="0.6" />
                  <circle cx="50" cy="70" r="1" fill="white" />
                  <rect x="25" y="1" width="50" height="18" fill="none" stroke="white" strokeWidth="0.6" />
                  <rect x="25" y="121" width="50" height="18" fill="none" stroke="white" strokeWidth="0.6" />
                  <rect x="35" y="1" width="30" height="8" fill="none" stroke="white" strokeWidth="0.6" />
                  <rect x="35" y="131" width="30" height="8" fill="none" stroke="white" strokeWidth="0.6" />
                  <circle cx="50" cy="15" r="3" fill="none" stroke="white" strokeWidth="0.5" />
                  <circle cx="50" cy="125" r="3" fill="none" stroke="white" strokeWidth="0.5" />
                </svg>

                {positions.map((pos, i) => {
                  const player = squadPlayers[i];
                  const rarityBorders = { common: "border-zinc-400", rare: "border-blue-400", epic: "border-purple-400", legendary: "border-amber-400" };
                  return (
                    <button
                      key={i}
                      onClick={() => player && setSelectedPlayer(player)}
                      className="absolute transform -translate-x-1/2 -translate-y-1/2"
                      style={{ left: `${pos[0]}%`, top: `${pos[1]}%` }}
                    >
                      {player ? (
                        <div className="flex flex-col items-center gap-0.5">
                          <div className={`w-9 h-9 rounded-full bg-gradient-to-b from-card to-secondary border-2 ${rarityBorders[player.rarity]} flex items-center justify-center shadow-lg`}>
                            <span className="text-white font-display font-bold text-xs">{player.overall_rating}</span>
                          </div>
                          <div className="bg-black/70 rounded px-1 py-0.5 max-w-16">
                            <p className="text-white text-[8px] font-semibold truncate">{player.name.split(" ")[0]}</p>
                          </div>
                        </div>
                      ) : (
                        <div className="flex flex-col items-center gap-0.5">
                          <div className="w-9 h-9 rounded-full border-2 border-dashed border-white/20 flex items-center justify-center">
                            <span className="text-white/20 text-xs">+</span>
                          </div>
                          <div className="bg-black/40 rounded px-1 py-0.5">
                            <p className="text-white/30 text-[8px]">Пусто</p>
                          </div>
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          ) : (
            <div>
              {squadPlayers.length === 0 ? (
                <div className="bg-card border border-dashed border-border rounded-2xl p-8 text-center">
                  <p className="text-muted-foreground text-sm">Добави играчи от резервите по-долу.</p>
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {squadPlayers.map(player => (
                    <PlayerCard key={player.id} player={player} onClick={() => setSelectedPlayer(player)} />
                  ))}
                </div>
              )}
            </div>
          )}

          <div>
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-display font-bold">Резерви ({benchPlayers.length})</h2>
              <Select value={filterPos} onValueChange={setFilterPos}>
                <SelectTrigger className="w-28 bg-card border-border h-8 text-xs rounded-xl">
                  <Filter className="w-3 h-3 mr-1" /><SelectValue />
                </SelectTrigger>
                <SelectContent>
                  <SelectItem value="all">Всички</SelectItem>
                  {["GK","CB","LB","RB","CDM","CM","CAM","LW","RW","ST","CF"].map(pos => (
                    <SelectItem key={pos} value={pos}>{pos}</SelectItem>
                  ))}
                </SelectContent>
              </Select>
            </div>
            {filteredBench.length === 0 ? (
              <div className="bg-card border border-dashed border-border rounded-2xl p-6 text-center">
                <p className="text-muted-foreground text-sm">Няма резервни играчи.</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                {filteredBench.sort((a,b) => b.overall_rating - a.overall_rating).map(player => (
                  <PlayerCard key={player.id} player={player} onClick={() => setSelectedPlayer(player)} />
                ))}
              </div>
            )}
          </div>

          <Dialog open={!!selectedPlayer} onOpenChange={() => setSelectedPlayer(null)}>
            <DialogContent className="bg-card border-border max-w-sm">
              <DialogHeader>
                <DialogTitle className="font-display text-lg">{selectedPlayer?.name}</DialogTitle>
              </DialogHeader>
              {selectedPlayer && (
                <div className="space-y-4">
                  <PlayerCard player={selectedPlayer} />
                  <Button
                    onClick={() => toggleSquad(selectedPlayer)}
                    className="w-full font-display"
                    variant={selectedPlayer.in_squad ? "destructive" : "default"}
                    disabled={!selectedPlayer.in_squad && squadPlayers.length >= 11}
                  >
                    {selectedPlayer.in_squad ? "Премахни от състава" : squadPlayers.length >= 11 ? "Съставът е пълен (11/11)" : "Добави в състава"}
                  </Button>
                </div>
              )}
            </DialogContent>
          </Dialog>
        </div>
      );
    }
  </script>

</body>
</html>
