<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Clash - Мачове</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #111418; margin: 0; min-height: 100vh; }
    .home-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background-color: #1B2028; border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px; display: flex; justify-content: space-around; align-items: center; z-index: 40;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 64px; padding: 4px 0; border-radius: 12px; background: transparent; border: none; cursor: pointer;
      color: rgba(255, 255, 255, 0.5); transition: all 0.2s ease;
    }
    .nav-btn:hover { color: #ffffff; }
    .nav-btn.active { color: #00e6c3; background-color: rgba(0, 137, 123, 0.15); }
    .nav-btn svg { width: 20px; height: 20px; margin-bottom: 4px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn span { font-size: 10px; font-weight: 600; font-family: sans-serif; }
  </style>
</head>
<body class="text-white min-h-screen px-3 py-4 pb-24 font-sans" onload="initMatches()">

  <div class="max-w-md mx-auto space-y-3">

    <!-- ГОРЕН HEADER BAR (Синхронизиран с localStorage) -->
    <div class="space-y-2">
      <div class="relative w-full bg-[#1c2128] border border-white/10 rounded-full p-1 flex items-center shadow-inner">
        <div class="absolute -left-1 flex items-center gap-1 bg-[#1c2128] border border-amber-500/50 px-2.5 py-1 rounded-full text-amber-400 font-bold text-xs shadow-md z-10">
          <span>★</span>
          <span id="player-level">1</span>
        </div>
        <div class="w-full bg-[#252b36] rounded-full h-5 relative overflow-hidden flex items-center justify-center">
          <div id="xp-fill" class="absolute left-0 top-0 bottom-0 bg-amber-400 rounded-full transition-all" style="width: 35%;"></div>
          <span id="xp-text" class="relative z-10 text-[11px] font-bold text-black">150 / 400</span>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto">
        <div class="flex items-center gap-2 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5 flex-1 min-w-[110px]">
          <span class="text-[#00c5bd] text-sm">⚡</span>
          <div class="flex-1 bg-black/50 rounded-full h-2 overflow-hidden">
            <div id="energy-fill" class="bg-[#00c5bd] h-full rounded-full transition-all" style="width: 100%;"></div>
          </div>
          <span class="text-xs font-bold text-white"><span id="player-energy">100</span>/<span id="player-max-energy">100</span></span>
        </div>

        <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
          <span class="text-amber-500 text-sm">🪙</span>
          <span id="player-coins" class="text-xs font-bold text-white">500</span>
        </div>

        <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
          <span class="text-[#40c4ff] text-sm">💎</span>
          <span id="player-gems" class="text-xs font-bold text-white">10</span>
        </div>
      </div>
    </div>

    <!-- Заглавие -->
    <div class="pt-1 flex items-center justify-between">
      <h1 class="text-xl font-bold">Мачове</h1>
      <button onclick="location.href='shop.html'" class="bg-[#252b36] hover:bg-[#303846] border border-white/10 text-xs px-3 py-1.5 rounded-full font-semibold transition">Магазин</button>
    </div>

    <!-- ОСНОВНО СЪДЪРЖАНИЕ НА МАЧОВЕТЕ -->
    <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-4 space-y-4">
      <p class="text-xs text-gray-300">Изиграй мач срещу съперник и спечели награди!</p>
      
      <div class="bg-[#111216] border border-white/10 rounded-xl p-3 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold text-[#00c5bd]">⚽ Бърз мач</p>
          <p class="text-[10px] text-gray-400">Награда: +50 монети, +20 XP</p>
        </div>
        <button onclick="playMatch(10)" class="bg-[#00c5bd] hover:bg-[#00b2aa] text-black text-xs font-bold px-3.5 py-1.5 rounded-lg cursor-pointer transition">Играй (10 ⚡)</button>
      </div>
    </div>

  </div>

  <!-- ДОЛНА НАВИГАЦИЯ (Свързва се с останалите отделни файлове) -->
  <nav class="home-bar">
    <button onclick="location.href='matches.html'" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6m12 5h1.5a2.5 2.5 0 000-5H18M6 4h12v6a6 6 0 01-12 0V4zm6 11v4m-3 0h6"></path></svg>
      <span>Мачове</span>
    </button>
    <button onclick="location.href='training.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h-3a1 1 0 00-1 1v10a1 1 0 001 1h3M17.5 6h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6.5 12h11M2 10h2v4H2zm18 0h2v4h-2z"></path></svg>
      <span>Трен.</span>
    </button>
    <button onclick="location.href='index.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Начало</span>
    </button>
    <button onclick="location.href='team.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span>Отбор</span>
    </button>
    <button onclick="location.href='profile.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Профил</span>
    </button>
  </nav>

  <script>
    // Общ обект за играча по подразбиране
    let player = { energy: 100, maxEnergy: 100, coins: 500, gems: 10, level: 1, xp: 150, maxXp: 400 };

    function initMatches() {
      // Зареждаме запазените данни от localStorage при отваряне на страницата
      const savedPlayer = localStorage.getItem('pitchClashPlayer');
      if (savedPlayer) {
        player = JSON.parse(savedPlayer);
      }
      updateUI();
    }

    function playMatch(cost) {
      if (player.energy < cost) {
        alert("Нямаш достатъчно енергия за мач!");
        return;
      }
      
      // Логика при изиграване на мач
      player.energy -= cost;
      player.coins += 50;
      player.xp += 20;

      // Проверка за ново ниво
      if (player.xp >= player.maxXp) {
        player.level += 1;
        player.xp -= player.maxXp;
        player.maxXp += 100;
        alert("Честито! Качи ново ниво!");
      }

      saveData();
      updateUI();
      alert("Победа! Спечели 50 монети и 20 XP.");
    }

    function saveData() {
      localStorage.setItem('pitchClashPlayer', JSON.stringify(player));
    }

    function updateUI() {
      document.getElementById("player-energy").innerText = player.energy;
      document.getElementById("player-max-energy").innerText = player.maxEnergy;
      document.getElementById("energy-fill").style.width = (player.energy / player.maxEnergy * 100) + "%";
      document.getElementById("player-coins").innerText = player.coins;
      document.getElementById("player-gems").innerText = player.gems;
      document.getElementById("player-level").innerText = player.level;
      document.getElementById("xp-text").innerText = player.xp + " / " + player.maxXp;
      document.getElementById("xp-fill").style.width = (player.xp / player.maxXp * 100) + "%";
    }
  </script>
</body>
</html>
