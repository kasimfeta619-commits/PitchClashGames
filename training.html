<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Clash - Тренировки</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .home-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #1B2028;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 64px; padding: 4px 0; border-radius: 12px; background: transparent; border: none; cursor: pointer;
      color: rgba(255, 255, 255, 0.5); transition: all 0.2s ease;
    }
    .nav-btn:hover { color: #ffffff; }
    .nav-btn.active { color: #00e6c3; background-color: rgba(0, 137, 123, 0.15); }
    .nav-btn svg { width: 20px; height: 20px; margin-bottom: 4px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn span { font-size: 10px; font-weight: 600; font-family: sans-serif; }
  </style>
</head>
<body class="bg-[#111418] text-white min-h-screen pb-24">

  <!-- ГОРЕН СТАТУС БАР -->
  <div class="max-w-md mx-auto p-4 space-y-2">
    <div class="relative w-full bg-[#1c2128] border border-white/10 rounded-full p-1 flex items-center shadow-inner">
      <div class="absolute -left-1 flex items-center gap-1 bg-[#1c2128] border border-amber-500/50 px-2.5 py-1 rounded-full text-amber-400 font-bold text-xs shadow-md z-10">
        <span>★</span>
        <span id="player-level">1</span>
      </div>
      <div class="w-full bg-[#252b36] rounded-full h-5 relative overflow-hidden flex items-center justify-center">
        <div id="xp-fill" class="absolute left-0 top-0 bottom-0 bg-amber-400 rounded-full transition-all" style="width: 35%;"></div>
        <span id="xp-text" class="relative z-10 text-[11px] font-bold text-black">35 / 100</span>
      </div>
    </div>

    <div class="flex items-center gap-2 overflow-x-auto">
      <div class="flex items-center gap-2 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5 flex-1 min-w-[110px]">
        <span class="text-amber-400 text-sm">⚡</span>
        <div class="flex-1 bg-black/50 rounded-full h-2 overflow-hidden">
          <div id="energy-fill" class="bg-amber-400 h-full rounded-full" style="width: 100%;"></div>
        </div>
        <span id="player-energy" class="text-xs font-bold text-white">100</span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-amber-600 text-sm">🪙</span>
        <span id="player-coins" class="text-xs font-bold text-white">1,250</span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-[#40c4ff] text-sm">💎</span>
        <span id="player-gems" class="text-xs font-bold text-white">45</span>
      </div>
      <button onclick="location.href='shop.html'" class="flex items-center gap-1.5 bg-[#7c3aed] hover:bg-[#6d28d9] transition-all text-white font-bold px-3.5 py-1.5 rounded-full text-xs shadow-md cursor-pointer flex-shrink-0">
        <span>🛒</span>
        <span>Магазин</span>
      </button>
    </div>
  </div>

  <!-- ОСНОВЕН СЪДЪРЖАТЕЛ -->
  <div class="max-w-2xl mx-auto px-4 py-2 space-y-4">
    <div>
      <h1 class="text-2xl font-bold">Тренировки</h1>
      <p class="text-gray-400 text-sm">Наеми треньори • кулдаун 30мин–7ч по ниво • без дневен лимит</p>
    </div>

    <div id="flash-message" class="hidden bg-[#00897B]/10 border border-[#00897B]/30 rounded-xl p-3 text-[#00e6c3] text-sm font-semibold text-center"></div>

    <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <p class="font-bold text-amber-400 text-lg">Ниво <span id="lbl-level">1</span></p>
          <p class="text-white/70 text-xs">Остават: <span id="lbl-xp-left">65</span> XP</p>
        </div>
        <div class="flex items-center gap-1.5 bg-black/40 rounded-xl px-2.5 py-1.5 border border-white/10">
          <span class="text-sm">⚡</span>
          <span id="lbl-energy" class="text-white text-sm font-bold">100</span>
          <span class="text-white/30 text-xs">/100</span>
        </div>
      </div>
      <div class="h-2 bg-white/10 rounded-full overflow-hidden">
        <div id="bar-xp" class="h-full bg-amber-400 rounded-full transition-all" style="width: 35%;"></div>
      </div>
      <div class="flex items-center justify-between pt-2 border-t border-white/10">
        <p class="text-white text-sm font-medium">Обща сила от тренери</p>
        <p id="lbl-total-coach" class="text-2xl font-bold text-amber-400">0</p>
      </div>
    </div>

    <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <p class="flex items-center gap-1.5 text-orange-500 font-bold text-sm">⚡ Серия тренировки (етап до 3)</p>
        <span id="lbl-streak" class="text-white/50 text-[10px]">0/3</span>
      </div>
      <div class="h-2 bg-white/10 rounded-full overflow-hidden">
        <div id="bar-streak" class="h-full bg-gradient-to-r from-orange-500 to-amber-400 rounded-full" style="width: 0%;"></div>
      </div>
      <p class="text-[10px] text-white/40">Завърши етапа за бонус (+1,000 XP, 100🪙)</p>
    </div>

    <div>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Треньорски слотове</p>
      <div id="coaches-container" class="space-y-3"></div>
    </div>
  </div>

  <!-- ДОЛНА НАВИГАЦИОННА ЛЕНТА С ПЪЛНИ БУТОНИ -->
  <nav class="home-bar">
    <button onclick="location.href='matches.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6m12 5h1.5a2.5 2.5 0 000-5H18M6 4h12v6a6 6 0 01-12 0V4zm6 11v4m-3 0h6"></path></svg>
      <span>Мачове</span>
    </button>
    <button onclick="location.href='training.html'" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h-3a1 1 0 00-1 1v10a1 1 0 001 1h3M17.5 6h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6.5 12h11M2 10h2v4H2zm18 0h2v4h-2z"></path></svg>
      <span>Трен.</span>
    </button>
    <button onclick="location.href='index.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Начало</span>
    </button>
    <button onclick="location.href='team.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span>Отбор</span>
    </button>
    <button onclick="location.href='profile.html'" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Профил</span>
    </button>
  </nav>

  <script>
    const CD_MIN = 30 * 60 * 1000;
    const CD_MAX = 7 * 60 * 60 * 1000;
    function coachCooldownMs(level) {
      if (level <= 1) return CD_MIN;
      if (level >= 7) return CD_MAX;
      return Math.round(CD_MIN + (CD_MAX - CD_MIN) * ((level - 1) / 6));
    }
    const STAGE_GOAL = 3;

    const COACH_SLOTS = [
      { id: "attack",  label: "Треньор по Атака",   icon: "⚽", stat: "attack",    color: "#ff4c4c" },
      { id: "defense", label: "Треньор по Защита",   icon: "🛡️", stat: "defense",    color: "#40c4ff" },
      { id: "tactic",  label: "Треньор по Тактика", icon: "🎯", stat: "technique", color: "#a060ec" },
      { id: "sprint",  label: "Треньор по Спринт",   icon: "⚡", stat: "speed",      color: "#ffd600" },
    ];

    const COACH_LEVELS = [
      { level: 1, cost: 100 }, { level: 2, cost: 500 }, { level: 3, cost: 1000 },
      { level: 4, cost: 2000 }, { level: 5, cost: 3000 }, { level: 6, cost: 4000 }, { level: 7, cost: 5000 },
    ];

    let gameData = JSON.parse(localStorage.getItem('pitchClashPlayer')) || {
      coins: 1250, gems: 45, energy: 100, max_energy: 100, xp: 35,
      attack: 50, defense: 50, technique: 50, speed: 50,
      training_coaches: {}, coach_cooldowns: {}, training_streak: 0
    };

    function saveData() {
      localStorage.setItem('pitchClashPlayer', JSON.stringify(gameData));
    }

    function showFlash(msg) {
      const el = document.getElementById('flash-message');
      el.innerText = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2500);
    }

    function fmtCd(ms) {
      if (ms <= 0) return "Готов";
      const h = Math.floor(ms / (1000*60*60));
      const m = Math.floor((ms % (1000*60*60)) / (1000*60));
      const s = Math.floor((ms % (1000*60)) / 1000);
      return `${h}ч ${m}м ${s}с`;
    }

    function hireCoach(slotId, level) {
      const tier = COACH_LEVELS[level - 1];
      if (gameData.coins < tier.cost) {
        showFlash("Нямаш достатъчно монети!");
        return;
      }
      gameData.coins -= tier.cost;
      if (!gameData.training_coaches) gameData.training_coaches = {};
      gameData.training_coaches[slotId] = level;
      saveData();
      renderUI();
      showFlash(`✅ Успешно нает треньор ниво ${level}!`);
    }

    function fireCoach(slotId) {
      if (!gameData.training_coaches) return;
      delete gameData.training_coaches[slotId];
      if (gameData.coach_cooldowns) delete gameData.coach_cooldowns[slotId];
      saveData();
      renderUI();
      showFlash("🗑️ Треньорът е уволнен.");
    }

    function doTraining(slotId) {
      if (gameData.energy < 20) {
        showFlash("Нямаш достатъчно енергия (20⚡)!");
        return;
      }

      const coaches = gameData.training_coaches || {};
      const coachLevel = coaches[slotId] || 0;
      
      const cooldowns = gameData.coach_cooldowns || {};
      const lastTime = cooldowns[slotId] ? new Date(cooldowns[slotId]).getTime() : 0;
      const cdMs = coachCooldownMs(coachLevel || 1);
      const remaining = cdMs - (Date.now() - lastTime);
      if (remaining > 0) {
        showFlash("Треньорът все още почива!");
        return;
      }

      const slot = COACH_SLOTS.find(s => s.id === slotId);
      const currentStat = gameData[slot.stat] || 50;
      const gain = Math.floor(Math.random() * 2) + 1 + coachLevel;

      gameData[slot.stat] = Math.min(99, currentStat + gain);
      gameData.energy -= 20;
      
      const xpGain = 25;
      gameData.xp = (gameData.xp || 0) + xpGain;
      gameData.training_streak = (gameData.training_streak || 0) + 1;

      let stageBonusText = "";
      if (gameData.training_streak >= STAGE_GOAL) {
        gameData.training_streak = 0;
        gameData.xp += 1000;
        gameData.coins += 100;
        stageBonusText = " 🎁 Етап завършен (+1000 XP, +100🪙)!";
      }

      cooldowns[slotId] = new Date().toISOString();
      gameData.coach_cooldowns = cooldowns;

      saveData();
      renderUI();
      showFlash(`+${gain} ${slot.label}! +${xpGain} XP.${stageBonusText}`);
    }

    function renderUI() {
      document.getElementById('player-level').innerText = "1";
      document.getElementById('player-energy').innerText = gameData.energy;
      document.getElementById('player-coins').innerText = gameData.coins.toLocaleString();
      document.getElementById('player-gems').innerText = gameData.gems;
      document.getElementById('lbl-energy').innerText = gameData.energy;
      
      const streak = gameData.training_streak || 0;
      document.getElementById('lbl-streak').innerText = `${streak}/${STAGE_GOAL}`;
      document.getElementById('bar-streak').style.width = `${(streak / STAGE_GOAL) * 100}%`;

      const coaches = gameData.training_coaches || {};
      let totalPower = 0;
      Object.values(coaches).forEach(l => totalPower += Number(l) || 0);
      document.getElementById('lbl-total-coach').innerText = totalPower;

      const container = document.getElementById('coaches-container');
      let html = "";

      COACH_SLOTS.forEach((slot, index) => {
        const coachLevel = coaches[slot.id] || 0;
        const hired = coachLevel > 0;
        const currentStat = gameData[slot.stat] || 50;

        let cdText = "Готов";
        let isReady = true;
        if (hired && gameData.coach_cooldowns && gameData.coach_cooldowns[slot.id]) {
          const cdMs = coachCooldownMs(coachLevel);
          const remaining = cdMs - (Date.now() - new Date(gameData.coach_cooldowns[slot.id]).getTime());
          if (remaining > 0) {
            cdText = fmtCd(remaining);
            isReady = false;
          }
        }

        let starsHtml = "";
        for (let i = 0; i < 7; i++) {
          starsHtml += `<span class="${i < coachLevel ? 'text-amber-400' : 'text-white/15'} text-[10px]">★</span>`;
        }

        let actionArea = "";
        if (hired) {
          actionArea = `
            <div class="flex items-center justify-between bg-black/40 rounded-lg px-2.5 py-1.5 mb-2">
              <span class="text-[10px] text-white/50">⏳ Кулдаун</span>
              <span class="text-xs font-bold ${isReady ? 'text-emerald-400' : 'text-white/60'}">${cdText}</span>
            </div>
            <div class="flex gap-2">
              <button onclick="doTraining('${slot.id}')" ${(!isReady || gameData.energy < 20) ? 'disabled' : ''} class="flex-1 h-9 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition-colors disabled:opacity-40 cursor-pointer">
                Тренирай (20⚡)
              </button>
              <button onclick="fireCoach('${slot.id}')" class="px-3 h-9 bg-red-500/15 border border-red-500/30 text-red-400 font-bold rounded-lg text-xs hover:bg-red-500/30 cursor-pointer">
                Уволни
              </button>
            </div>
          `;
        } else {
          let levelsHtml = "";
          COACH_LEVELS.forEach(tier => {
            const canAfford = gameData.coins >= tier.cost;
            levelsHtml += `
              <button onclick="hireCoach('${slot.id}', ${tier.level})" ${!canAfford ? 'disabled' : ''} title="Ниво ${tier.level} • ${tier.cost}🪙" class="flex flex-col items-center justify-center rounded-lg py-1.5 border text-[10px] font-bold transition-all ${canAfford ? 'bg-emerald-600/15 border-amber-400/40 text-amber-400 hover:bg-emerald-600/30 cursor-pointer' : 'bg-white/5 border-white/10 text-white/25 cursor-not-allowed'}">
                <span>${tier.level}★</span>
                <span class="text-[8px] font-normal text-white/50">${tier.cost >= 1000 ? (tier.cost/1000)+'k' : tier.cost}</span>
              </button>
            `;
          });
          actionArea = `<div class="grid grid-cols-7 gap-1">${levelsHtml}</div>`;
        }

        html += `
          <div class="bg-[#1c2128] border border-white/10 rounded-2xl p-4">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <span class="text-2xl">${slot.icon}</span>
                <div>
                  <p class="font-bold text-white text-sm">Слот ${index + 1}: ${slot.label}</p>
                  <p class="text-[10px] text-gray-400">Статус: ${hired ? `<span class="text-amber-400">Треньор Ниво ${coachLevel}</span>` : "Няма треньор"}</p>
                </div>
              </div>
              <div class="text-right">
                <p class="text-lg font-bold" style="color: ${slot.color};">${currentStat}</p>
                <div class="flex gap-0.5 justify-end">${starsHtml}</div>
              </div>
            </div>
            ${actionArea}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    setInterval(renderUI, 1000);
    renderUI();
  </script>
</body>
</html>
