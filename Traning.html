<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Clash - Тренировки</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Допълнителни стилове за HomeBar навигацията -->
  <style>
    .home-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1B2028;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 64px;
      padding: 4px 0;
      border-radius: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      color: #ffffff;
    }
    .nav-btn.active {
      color: #00e6c3;
      background-color: rgba(0, 137, 123, 0.15);
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-btn span {
      font-size: 10px;
      font-weight: 600;
      font-family: sans-serif;
    }
  </style>
</head>
<body class="bg-[#111418] text-white min-h-screen pb-24">

  <!-- ГОРЕН ИНФО БАР (HeaderBar) -->
  <div class="max-w-md mx-auto space-y-2 p-4">
    <!-- ГОРЕН XP / НИВО БАР -->
    <div class="relative w-full bg-[#1c2128] border border-white/10 rounded-full p-1 flex items-center shadow-inner">
      <div class="absolute -left-1 flex items-center gap-1 bg-[#1c2128] border border-amber-500/50 px-2.5 py-1 rounded-full text-amber-400 font-bold text-xs shadow-md z-10">
        <span>★</span>
        <span id="player-level">0</span>
      </div>
      <div class="w-full bg-[#252b36] rounded-full h-5 relative overflow-hidden flex items-center justify-center">
        <div id="xp-fill" class="absolute left-0 top-0 bottom-0 bg-amber-400 rounded-full transition-all" style="width: 0%;"></div>
        <span id="xp-text" class="relative z-10 text-[11px] font-bold text-black">0 / 100</span>
      </div>
    </div>

    <!-- ДОЛЕН РЕД (Енергия, Монети, Диаманти, Магазин) -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      <div class="flex items-center gap-2 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5 flex-1 min-w-[110px]">
        <span class="text-amber-400 text-sm">⚡</span>
        <div class="flex-1 bg-black/50 rounded-full h-2 overflow-hidden">
          <div id="energy-fill" class="bg-amber-400 h-full rounded-full" style="width: 100%;"></div>
        </div>
        <span id="player-energy" class="text-xs font-bold text-white">100</span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-amber-600 text-sm">🪙</span>
        <span id="player-coins" class="text-xs font-bold text-white">6000</span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1c2128] border border-white/10 rounded-full px-3 py-1.5">
        <span class="text-[#40c4ff] text-sm">💎</span>
        <span id="player-gems" class="text-xs font-bold text-white">0</span>
      </div>
      <button onclick="openShop()" class="flex items-center gap-1.5 bg-[#7c3aed] hover:bg-[#6d28d9] transition-all text-white font-bold px-3.5 py-1.5 rounded-full text-xs shadow-md cursor-pointer flex-shrink-0">
        <span>🛒</span>
        <span>Магазин</span>
      </button>
    </div>
  </div>

  <!-- ОСНОВЕН КОНТЕЙНЕР ЗА ТРЕНИРОВКИ -->
  <main class="max-w-md mx-auto px-4 space-y-4">
    <div>
      <h1 class="text-2xl font-bold text-white">Тренировки</h1>
      <p class="text-[#a0a0a0] text-sm">Наеми треньори • кулдаун 30мин–7ч по ниво</p>
      <p id="city-bonus" class="text-[10px] text-[#00e6c3] mt-1">🏋️ Тренировъчна база ниво 1: +10% XP от всяка тренировка</p>
    </div>

    <div id="flash-message" class="hidden bg-[#00897B]/10 border border-[#00897B]/30 rounded-xl p-3 text-[#00e6c3] text-sm font-semibold text-center transition-all"></div>

    <div class="bg-[#1B2028] border border-white/10 rounded-2xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <p class="flex items-center gap-1.5 text-[#FF5722] font-bold text-sm">⚡ Серия тренировки</p>
        <span class="text-white/50 text-[10px]" id="streak-text">0/3</span>
      </div>
      <div class="h-2 bg-white/10 rounded-full overflow-hidden">
        <div id="streak-bar" class="h-full bg-gradient-to-r from-[#FF5722] to-[#FFD600] rounded-full" style="width: 0%;"></div>
      </div>
    </div>

    <div id="result-box" class="hidden bg-[#00897B]/10 border border-[#00897B]/30 rounded-2xl p-4 flex items-center gap-4 transition-all">
      <span class="text-3xl" id="res-icon">⚽</span>
      <div class="flex-1">
        <p class="font-bold text-lg text-[#00e6c3]" id="res-title">+2 Атака!</p>
        <p class="text-sm text-white/70" id="res-desc">Сега: 0 • +17 XP</p>
      </div>
    </div>

    <div>
      <p class="text-xs font-bold text-[#a0a0a0] uppercase tracking-wide mb-2">Треньорски слотове</p>
      <div class="space-y-3" id="slots-container"></div>
    </div>
  </main>

  <!-- ДОЛНА НАВИГАЦИОННА ЛЕНТА (HomeBar) -->
  <nav class="home-bar">
    <button onclick="alert('Мачове - очаквайте скоро!')" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6m12 5h1.5a2.5 2.5 0 000-5H18M6 4h12v6a6 6 0 01-12 0V4zm6 11v4m-3 0h6"></path></svg>
      <span>Мачове</span>
    </button>
    <button onclick="window.location.reload()" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h-3a1 1 0 00-1 1v10a1 1 0 001 1h3M17.5 6h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6.5 12h11M2 10h2v4H2zm18 0h2v4h-2z"></path></svg>
      <span>Трен.</span>
    </button>
    <button onclick="alert('Начало - скоро!')" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Начало</span>
    </button>
    <button onclick="alert('Отбор - скоро!')" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span>Отбор</span>
    </button>
    <button onclick="alert('Профил - скоро!')" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Профил</span>
    </button>
  </nav>

  <!-- ЛОГИКА ЗА ТРЕНИРОВКИТЕ -->
  <script>
    function openShop() {
      alert("Магазинът ще бъде отворен скоро!");
    }

    function getSportCityData() {
      const saved = localStorage.getItem('sportCityTrainingBase');
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return { level: 1, xpBonusPercent: 0.10 };
    }

    const CD_MIN = 30 * 60 * 1000;
    const CD_MAX = 7 * 60 * 60 * 1000;

    function coachCooldownMs(level) {
      if (level <= 1) return CD_MIN;
      if (level >= 7) return CD_MAX;
      return Math.round(CD_MIN + (CD_MAX - CD_MIN) * ((level - 1) / 6));
    }

    const COACH_SLOTS = [
      { id: "attack", label: "Треньор по Атака", icon: "⚽", stat: "attack", color: "#ff4c4c" },
      { id: "defense", label: "Треньор по Защита", icon: "🛡️", stat: "defense", color: "#40c4ff" },
      { id: "tactic", label: "Треньор по Тактика", icon: "🎯", stat: "technique", color: "#a060ec" },
      { id: "sprint", label: "Треньор по Спринт", icon: "⚡", stat: "speed", color: "#ffd600" },
    ];

    const COACH_LEVELS = [
      { level: 1, cost: 100 }, { level: 2, cost: 500 }, { level: 3, cost: 1000 },
      { level: 4, cost: 2000 }, { level: 5, cost: 3000 }, { level: 6, cost: 4000 }, { level: 7, cost: 5000 },
    ];

    let player = {
      xp: 0,
      energy: 100,
      coins: 6000,
      attack: 0,
      defense: 0,
      technique: 0,
      speed: 0,
      training_streak: 0,
      training_coaches: {},
      coach_cooldowns: {}
    };

    function showFlash(msg) {
      const f = document.getElementById('flash-message');
      if (!f) return;
      f.innerText = msg;
      f.classList.remove('hidden');
      setTimeout(() => f.classList.add('hidden'), 2000);
    }

    function fmtCd(ms) {
      if (ms <= 0) return "Готов";
      const h = Math.floor(ms / (1000 * 60 * 60));
      const m = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((ms % (1000 * 60)) / 1000);
      return `${h}ч ${m}м ${s}с`;
    }

    function getCooldownMsRemaining(slotId) {
      const lvl = player.training_coaches[slotId] || 0;
      if (!lvl) return 0;
      const cdMs = coachCooldownMs(lvl);
      const last = player.coach_cooldowns[slotId] ? new Date(player.coach_cooldowns[slotId]).getTime() : 0;
      const remaining = cdMs - (Date.now() - last);
      return remaining <= 0 ? 0 : remaining;
    }

    function hireCoach(slotId, level) {
      const tier = COACH_LEVELS[level - 1];
      if (player.coins < tier.cost) {
        showFlash("Нямаш достатъчно монети!");
        return;
      }
      player.coins -= tier.cost;
      player.training_coaches[slotId] = level;
      document.getElementById('player-coins').innerText = player.coins;
      showFlash(`✅ Успешно нает треньор ниво ${level}!`);
      renderTraining();
    }

    function fireCoach(slotId) {
      delete player.training_coaches[slotId];
      delete player.coach_cooldowns[slotId];
      showFlash("⚠️ Треньорът беше уволнен.");
      renderTraining();
    }

    function doTraining(slotId) {
      const slot = COACH_SLOTS.find(s => s.id === slotId);
      if (player.energy < 20) {
        showFlash("⚡ Нямаш достатъчно енергия!");
        return;
      }
      if (getCooldownMsRemaining(slot.id) > 0) return;

      const coachLevel = player.training_coaches[slot.id] || 0;
      const currentStat = player[slot.stat];
      const gain = Math.min(99 - currentStat, Math.floor(Math.random() * 2) + 1 + coachLevel);

      player[slot.stat] += gain;
      player.energy -= 20;
      document.getElementById('player-energy').innerText = player.energy;
      document.getElementById('energy-fill').style.width = player.energy + '%';

      player.training_streak = (player.training_streak + 1) % 4;
      if (player.training_streak === 0) player.training_streak = 3;

      const trainingBase = getSportCityData();
      const rawXp = 15 + Math.floor(Math.random() * 10);
      const xpGain = Math.round(rawXp * (1 + trainingBase.xpBonusPercent));
      player.xp += xpGain;

      // Обновяване на XP бара (примерно до 100 за ниво)
      const currentLevelXP = player.xp % 100;
      const currentLevel = Math.floor(player.xp / 100);
      document.getElementById('player-level').innerText = currentLevel;
      document.getElementById('xp-fill').style.width = currentLevelXP + '%';
      document.getElementById('xp-text').innerText = `${currentLevelXP} / 100`;

      player.coach_cooldowns[slot.id] = new Date().toISOString();

      const resBox = document.getElementById('result-box');
      if (resBox) {
        document.getElementById('res-icon').innerText = slot.icon;
        document.getElementById('res-title').innerText = `+${gain} ${slot.label}!`;
        document.getElementById('res-desc').innerText = `Сега: ${player[slot.stat]} • +${xpGain} XP`;
        resBox.classList.remove('hidden');
        setTimeout(() => resBox.classList.add('hidden'), 3000);
      }

      renderTraining();
    }

    function renderTraining() {
      const trainingBase = getSportCityData();
      const bonusEl = document.getElementById('city-bonus');
      if (bonusEl) bonusEl.innerText = `🏋️ Тренировъчна база ниво ${trainingBase.level}: +${trainingBase.xpBonusPercent * 100}% XP`;

      const streakPct = (player.training_streak / 3) * 100;
      const streakText = document.getElementById('streak-text');
      const streakBar = document.getElementById('streak-bar');
      if (streakText) streakText.innerText = `${player.training_streak}/3`;
      if (streakBar) streakBar.style.width = `${Math.min(100, streakPct)}%`;

      const container = document.getElementById('slots-container');
      if (!container) return;
      container.innerHTML = '';

      COACH_SLOTS.forEach((slot, index) => {
        const hired = !!player.training_coaches[slot.id];
        const coachLevel = player.training_coaches[slot.id] || 0;
        const currentStat = player[slot.stat];
        const cdMs = getCooldownMsRemaining(slot.id);
        const ready = cdMs <= 0;

        let starsHTML = '';
        for (let i = 0; i < 7; i++) {
          starsHTML += `<span class="${i < coachLevel ? 'text-[#FFD600]' : 'text-white/15'} text-[10px]">★</span>`;
        }

        let contentHTML = '';
        if (hired) {
          contentHTML = `
            <div class="flex items-center justify-between bg-[#121212] rounded-lg px-2.5 py-1.5 mb-2">
              <span class="text-[10px] text-white/50">⏱️ Кулдаун</span>
              <span class="text-xs font-bold ${ready ? 'text-[#00e6c3]' : 'text-white/60'}">${fmtCd(cdMs)}</span>
            </div>
            <div class="flex gap-2">
              <button onclick="doTraining('${slot.id}')" ${!ready || player.energy < 20 ? 'disabled' : ''}
                class="flex-1 h-9 bg-[#00897B] hover:bg-[#00a89e] text-white font-bold rounded-lg text-xs transition-colors disabled:opacity-40 flex items-center justify-center gap-1 cursor-pointer">
                ➕ Тренирай (20⚡)
              </button>
              <button onclick="fireCoach('${slot.id}')" class="px-3 h-9 bg-red-500/15 border border-red-500/30 text-red-400 font-bold rounded-lg text-xs cursor-pointer hover:bg-red-500/25">
                Уволни
              </button>
            </div>
          `;
        } else {
          let tiersHTML = '<div class="grid grid-cols-7 gap-1">';
          COACH_LEVELS.forEach(tier => {
            tiersHTML += `
              <button onclick="hireCoach('${slot.id}', ${tier.level})" class="bg-[#00897B]/15 border border-[#FFD600]/40 text-[#FFD600] flex flex-col items-center justify-center rounded-lg py-1.5 text-[10px] font-bold cursor-pointer hover:bg-[#00897B]/30">
                <span>${tier.level}★</span>
                <span class="text-[8px] font-normal text-white/50">${tier.cost >= 1000 ? (tier.cost/1000)+'k' : tier.cost}</span>
              </button>
            `;
          });
          tiersHTML += '</div>';
          contentHTML = tiersHTML;
        }

        const card = document.createElement('div');
        card.className = "bg-[#1B2028] border border-white/10 rounded-2xl p-4";
        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-2xl">${slot.icon}</span>
              <div>
                <p class="font-bold text-white text-sm">Слот ${index + 1}: ${slot.label}</p>
                <p class="text-[10px] text-[#a0a0a0]">Статус: ${hired ? `<span class="text-[#FFD600]">Ниво ${coachLevel}</span>` : 'Няма треньор'}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="font-bold text-lg" style="color: ${slot.color}">${currentStat}</p>
              <div class="flex gap-0.5 justify-end">${hired ? starsHTML : '<p class="text-[9px] text-[#a0a0a0]">Наеми ★</p>'}</div>
            </div>
          </div>
          ${contentHTML}
        `;
        container.appendChild(card);
      });
    }

    setInterval(() => {
      renderTraining();
    }, 1000);

    renderTraining();
  </script>

</body>
</html>
